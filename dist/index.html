<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>WebXR Marker Exhibition</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #111;
  color: white;
  text-align: center;
}

#start-inner {
  width: 100%;
  max-width: 430px;
}

#start h1 {
  margin: 0 0 15px;
  font-size: 30px;
}

#start p {
  opacity: 0.75;
  line-height: 1.5;
}

#start-button {
  width: 100%;
  padding: 18px;

  border: 0;
  border-radius: 14px;

  background: white;
  color: black;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#status {
  position: fixed;

  top: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 50;

  display: none;

  width: calc(100% - 30px);
  max-width: 480px;

  padding: 14px 18px;

  border-radius: 14px;

  background: rgba(0,0,0,0.72);
  color: white;

  text-align: center;
  line-height: 1.4;

  pointer-events: none;
}

#debug {
  position: fixed;

  bottom: 20px;
  left: 20px;

  z-index: 50;

  display: none;

  padding: 12px 14px;

  border-radius: 10px;

  background: rgba(0,0,0,0.72);
  color: white;

  font-family: monospace;
  font-size: 12px;

  pointer-events: none;
}

#error {
  position: fixed;
  inset: 0;

  z-index: 200;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #111;
  color: white;

  text-align: center;
}

#error > div {
  max-width: 500px;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
  <script type="module" crossorigin src="/assets/index-Cq0QENmt.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three-C5aeorcY.js">
</head>

<body>

<div id="start">
  <div id="start-inner">

    <h1>Wystawa AR</h1>

    <p>
      Uruchom AR i skieruj kamerę na marker Hiro
      wydrukowany na ścianie.
      <br><br>
      Po wykryciu markera wystawa zostanie
      automatycznie ustawiona w przestrzeni.
    </p>

    <button id="start-button">
      URUCHOM AR
    </button>

  </div>
</div>


<div id="status">
  Szukam markera HIRO...
</div>


<div id="debug">

  MARKER:
  <span id="marker-state">NIE</span>

  <br>

  KALIBRACJA:
  <span id="calibration-state">NIE</span>

  <br><br>

  RUCH:
  <span id="distance">0.00</span> m

</div>


<div id="error">
  <div>
    <h2>AR niedostępne</h2>
    <p id="error-text"></p>
  </div>
</div>







</body>
</html>
