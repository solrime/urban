<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>HIRO AR Exhibition</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.JS - MARKER TRACKING -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 450px;

      padding: 15px 18px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      border-radius: 14px;

      text-align: center;

      z-index: 9999;

      pointer-events: none;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #info {
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.4;
    }

    #debug {
      margin-top: 8px;
      font-family: monospace;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<!-- ========================================== -->
<!-- UI                                         -->
<!-- ========================================== -->

<div id="ui">

  <div id="status">
    🔎 Szukam markera HIRO...
  </div>

  <div id="info">
    Skieruj kamerę na marker znajdujący się na ścianie.
  </div>

  <div id="debug">
    marker: niewidoczny
  </div>

</div>


<!-- ========================================== -->
<!-- SCENA AR                                   -->
<!-- ========================================== -->

<a-scene

  embedded

  vr-mode-ui="enabled: false"

  renderer="
    antialias: true;
    alpha: true;
    colorManagement: true;
  "

  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
    detectionMode: mono;
    matrixCodeType: 3x3;
  "

>


  <!-- ======================================== -->
  <!-- ŚWIATŁO                                 -->
  <!-- ======================================== -->

  <a-entity
    light="
      type: ambient;
      intensity: 1.5;
      color: #ffffff;
    "
  ></a-entity>


  <a-entity
    light="
      type: directional;
      intensity: 1.5;
      color: #ffffff;
    "

    position="1 3 2"

  ></a-entity>



  <!-- ======================================== -->
  <!-- MARKER HIRO                              -->
  <!-- ======================================== -->

  <!--
      Marker jest naszym fizycznym punktem
      odniesienia.

      UWAGA:

      Lokalny układ współrzędnych poniżej
      należy do markera.

      Czyli:

            Y
            ↑
            |
            |
            +----→ X

      Z wychodzi prostopadle z markera.
  -->

  <a-marker
    id="hiro-marker"
    preset="hiro"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >


    <!-- ====================================== -->
    <!-- DEBUG MARKERA                          -->
    <!-- ====================================== -->

    <!--
        Mały czerwony box bezpośrednio
        na markerze.

        Dzięki niemu od razu widzimy,
        czy marker jest poprawnie śledzony.
    -->

    <a-box
      position="0 0.05 0"
      scale="0.15 0.1 0.15"
      color="#ff0000"
    ></a-box>



    <!-- ====================================== -->
    <!-- CAŁA WYSTAWA                           -->
    <!-- ====================================== -->

    <!--
        TO JEST NAJWAŻNIEJSZY ELEMENT.

        Cała wystawa jest dzieckiem markera.

        Jeżeli marker jest na ścianie,
        możemy przesunąć wystawę:

        w dół,
        przed ścianę,
        w lewo / prawo.

        Te wartości trzeba skalibrować
        pod fizyczne miejsce.
    -->

    <a-entity

      id="exhibition"

      position="0 -1.5 1.0"

      rotation="-90 0 0"

    >


      <!-- ==================================== -->
      <!-- PUNKT ZERO                           -->
      <!-- ==================================== -->

      <a-cylinder

        position="0 0.01 0"

        radius="0.15"

        height="0.02"

        color="#ffffff"

      ></a-cylinder>



      <!-- ==================================== -->
      <!-- RZEŹBA 1                             -->
      <!-- ==================================== -->

      <a-box

        position="0 0.4 -0.8"

        width="0.3"

        height="0.8"

        depth="0.3"

        color="#ff3333"

      ></a-box>



      <!-- ==================================== -->
      <!-- RZEŹBA 2                             -->
      <!-- ==================================== -->

      <a-sphere

        position="-0.7 0.25 -1.3"

        radius="0.25"

        color="#3388ff"

      ></a-sphere>



      <!-- ==================================== -->
      <!-- RZEŹBA 3                             -->
      <!-- ==================================== -->

      <a-cylinder

        position="0.8 0.6 -1.5"

        radius="0.18"

        height="1.2"

        color="#33dd77"

      ></a-cylinder>



      <!-- ==================================== -->
      <!-- RZEŹBA 4                             -->
      <!-- ==================================== -->

      <a-torus

        position="-0.5 0.6 -2.2"

        radius="0.35"

        radius-tubular="0.1"

        rotation="90 0 0"

        color="#ffcc22"

      ></a-torus>



      <!-- ==================================== -->
      <!-- RZEŹBA 5                             -->
      <!-- ==================================== -->

      <a-cone

        position="0.7 0.5 -2.5"

        radius-bottom="0.35"

        radius-top="0"

        height="1"

        color="#cc44ff"

      ></a-cone>



      <!-- ==================================== -->
      <!-- RZEŹBA 6                             -->
      <!-- ==================================== -->

      <a-box

        position="0 0.35 -3.2"

        width="0.7"

        height="0.7"

        depth="0.7"

        rotation="0 45 0"

        color="#00dddd"

      ></a-box>


    </a-entity>


  </a-marker>



  <!-- ======================================== -->
  <!-- KAMERA                                   -->
  <!-- ======================================== -->

  <a-entity camera></a-entity>


</a-scene>



<script>

  /* ========================================== */
  /* ELEMENTY                                   */
  /* ========================================== */

  const marker =
    document.querySelector("#hiro-marker");

  const status =
    document.querySelector("#status");

  const info =
    document.querySelector("#info");

  const debug =
    document.querySelector("#debug");


  let markerVisible = false;

  let foundCounter = 0;

  let lostCounter = 0;



  /* ========================================== */
  /* MARKER FOUND                               */
  /* ========================================== */

  marker.addEventListener(
    "markerFound",
    function () {

      markerVisible = true;

      foundCounter++;


      status.innerHTML =
        "✓ MARKER ZNALEZIONY";


      info.innerHTML =
        "Punkt odniesienia wystawy został wykryty.";


      debug.innerHTML =
        "marker: widoczny | wykrycia: "
        + foundCounter;

    }
  );



  /* ========================================== */
  /* MARKER LOST                                */
  /* ========================================== */

  marker.addEventListener(
    "markerLost",
    function () {

      markerVisible = false;

      lostCounter++;


      status.innerHTML =
        "⚠ MARKER POZA KADREM";


      info.innerHTML =
        "Skieruj kamerę ponownie na marker HIRO.";


      debug.innerHTML =
        "marker: niewidoczny | utracenia: "
        + lostCounter;

    }
  );



  /* ========================================== */
  /* DEBUG                                      */
  /* ========================================== */

  setInterval(
    function () {

      if (!markerVisible) {
        return;
      }


      const object =
        marker.object3D;


      const p =
        object.position;


      debug.innerHTML =

        "marker: widoczny" +

        "<br>X: " +
        p.x.toFixed(2) +

        " Y: " +
        p.y.toFixed(2) +

        " Z: " +
        p.z.toFixed(2);

    },

    200
  );

</script>


</body>
</html>
