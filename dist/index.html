    #start-screen {

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #111;
      color: white;
      text-align: center;

    .start-box {
      width: 100%;
      max-width: 420px;

    .start-box h1 {
      margin: 0 0 15px;
      font-size: 32px;

    .start-box p {
      margin: 0 0 25px;

    #start-ar {
      width: 100%;

      padding: 18px 24px;

      border: none;
      border-radius: 14px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    /* ============================== */
    /* UI W AR                       */
    /* ============================== */

    #ar-ui {
      position: fixed;
      inset: 0;

      z-index: 20;

      display: none;

      pointer-events: none;
    }

    #instruction {
      position: absolute;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 430px;

      padding: 14px 18px;

      border-radius: 15px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      text-align: center;

      font-size: 14px;
      line-height: 1.4;
    }

    #status {
      position: absolute;

      bottom: 30px;
      left: 50%;

      transform: translateX(-50%);

      padding: 10px 16px;

      border-radius: 100px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 13px;
    }

    /* ============================== */
    /* ERROR                         */
    /* ============================== */

      display: none;

      padding: 30px;

      background: #111;
      color: white;

      text-align: center;
    }
