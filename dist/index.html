<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>WebAR Exhibition</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}


/* ========================================= */
/* START                                     */
/* ========================================= */

#start {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #111;
  color: white;

  text-align: center;
}

#start-inner {
  width: 100%;
  max-width: 420px;
}

#start h1 {
  margin: 0 0 15px;
  font-size: 32px;
}

#start p {
  margin: 0 0 25px;

  opacity: 0.75;

  font-size: 16px;
  line-height: 1.5;
}

#start-button {
  width: 100%;

  padding: 18px;

  border: 0;
  border-radius: 14px;

  background: white;
  color: black;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}


/* ========================================= */
/* INFO                                      */
/* ========================================= */

#instruction {
  position: fixed;

  top: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 50;

  display: none;

  width: calc(100% - 30px);
  max-width: 450px;

  padding: 14px 18px;

  border-radius: 14px;

  background: rgba(0,0,0,0.72);
  color: white;

  text-align: center;

  font-size: 14px;
  line-height: 1.4;

  pointer-events: none;
}


/* ========================================= */
/* DEBUG                                     */
/* ========================================= */

#debug {
  position: fixed;

  bottom: 20px;
  left: 20px;

  z-index: 50;

  display: none;

  padding: 10px 14px;

  border-radius: 10px;

  background: rgba(0,0,0,0.65);
  color: white;

  font-family: monospace;
  font-size: 12px;

  pointer-events: none;
}


/* ========================================= */
/* ERROR                                     */
/* ========================================= */

#error {
  position: fixed;
  inset: 0;

  z-index: 200;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #111;
  color: white;

  text-align: center;
}

</style>
<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
  <script type="module" crossorigin src="/assets/index-BmjsWtGQ.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three-DrTfNg72.js">
</head>


<body>


<!-- ======================================= -->
<!-- START                                   -->
<!-- ======================================= -->

<div id="start">

  <div id="start-inner">

    <h1>Wystawa AR</h1>

    <p>
      Skieruj telefon na podłogę.
      <br><br>
      Kiedy pojawi się białe kółko,
      dotknij ekranu.
      <br><br>
      Punkt można ustawić tylko raz.
    </p>

    <button id="start-button">
      URUCHOM AR
    </button>

  </div>

</div>


<!-- ======================================= -->
<!-- INFO                                    -->
<!-- ======================================= -->

<div id="instruction">
  Szukam podłogi...
</div>


<!-- ======================================= -->
<!-- DEBUG                                   -->
<!-- ======================================= -->

<div id="debug">

  RUCH:
  <span id="distance">0.00</span> m

</div>


<!-- ======================================= -->
<!-- ERROR                                   -->
<!-- ======================================= -->

<div id="error">

  <div>

    <h2>AR niedostępne</h2>

    <p id="error-text"></p>

  </div>

</div>



<!-- ======================================= -->
<!-- THREE.JS                                -->
<!-- ======================================= -->





</body>
</html>
