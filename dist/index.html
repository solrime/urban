<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>HIRO AR Exhibition</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.JS -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: Arial, sans-serif;
    }


    /* ====================================== */
    /* KAMERA                                 */
    /* ====================================== */

    video {
      position: fixed !important;

      top: 50% !important;
      left: 50% !important;

      transform:
        translate(-50%, -50%) !important;

      width: 100vw !important;
      height: 100vh !important;

      max-width: none !important;
      max-height: none !important;

      object-fit: contain !important;

      margin: 0 !important;
      padding: 0 !important;

      z-index: -2 !important;
    }


    canvas,
    .a-canvas {
      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      margin: 0 !important;
      padding: 0 !important;
    }


    /* ====================================== */
    /* UI                                     */
    /* ====================================== */

    #ui {
      position: fixed;

      top: max(
        15px,
        env(safe-area-inset-top)
      );

      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 30px);
      max-width: 460px;

      padding: 14px 16px;

      border-radius: 14px;

      background: rgba(0, 0, 0, 0.72);

      color: white;

      text-align: center;

      z-index: 99999;

      pointer-events: none;
    }


    #status {
      font-size: 17px;
      font-weight: bold;
    }


    #info {
      margin-top: 5px;

      font-size: 13px;

      opacity: 0.8;

      line-height: 1.4;
    }


    #debug {
      margin-top: 8px;

      font-family: monospace;

      font-size: 11px;

      opacity: 0.7;
    }


    /* ====================================== */
    /* CAMERA CONTROLS                        */
    /* ====================================== */

    #camera-controls {
      position: fixed;

      bottom: max(
        20px,
        env(safe-area-inset-bottom)
      );

      left: 50%;

      transform: translateX(-50%);

      z-index: 999999;

      display: flex;

      gap: 8px;
    }


    #camera-controls button {
      padding: 11px 16px;

      border: none;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }


    #camera-controls button.active {
      background: white;
      color: black;
    }

  </style>
</head>


<body>


<!-- ======================================== -->
<!-- UI                                       -->
<!-- ======================================== -->

<div id="ui">

  <div id="status">
    🔎 Szukam HIRO...
  </div>

  <div id="info">
    Skieruj kamerę na marker na ścianie.
  </div>

  <div id="debug">
    marker: niewidoczny
  </div>

</div>



<!-- ======================================== -->
<!-- CAMERA FIT                               -->
<!-- ======================================== -->

<div id="camera-controls">

  <button
    id="contain-button"
    class="active"
  >
    CONTAIN
  </button>

  <button
    id="cover-button"
  >
    COVER
  </button>

</div>



<!-- ======================================== -->
<!-- SCENA AR                                 -->
<!-- ======================================== -->

<a-scene

  embedded

  vr-mode-ui="
    enabled: false
  "

  renderer="
    antialias: true;
    alpha: true;
    colorManagement: true;
  "

  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
    detectionMode: mono;
    trackingMethod: best;
  "

>


  <!-- ====================================== -->
  <!-- ASSETS                                 -->
  <!-- ====================================== -->

  <a-assets>

    <a-asset-item
      id="model-1"
      src="https://cdn.tinyglb.com/models/7f210788d6204cf09324b3655d9bead3.glb"
    ></a-asset-item>


    <a-asset-item
      id="model-2"
      src="https://cdn.tinyglb.com/models/778255d1a4ea48e8b0d28b870625a541.glb"
    ></a-asset-item>


    <a-asset-item
      id="model-3"
      src="https://cdn.tinyglb.com/models/2421e7d6e984447c9a70bcf0ebaaebbe.glb"
    ></a-asset-item>

  </a-assets>



  <!-- ====================================== -->
  <!-- ŚWIATŁO                                -->
  <!-- ====================================== -->

  <a-entity

    light="
      type: ambient;
      intensity: 1.5;
      color: #ffffff;
    "

  ></a-entity>


  <a-entity

    light="
      type: directional;
      intensity: 1.5;
      color: #ffffff;
    "

    position="2 4 3"

  ></a-entity>



  <!-- ====================================== -->
  <!-- MARKER HIRO                            -->
  <!-- ====================================== -->

  <a-marker

    id="hiro-marker"

    preset="hiro"

    smooth="true"

    smoothCount="15"

    smoothTolerance="0.01"

    smoothThreshold="5"

  >


    <!-- ==================================== -->
    <!-- WYSTAWA                              -->
    <!-- ==================================== -->

    <!--
      Na razie exhibition siedzi
      dokładnie w centrum markera.

      Wszystkie trzy modele mają:
          position="0 0 0"

      czyli idealnie ten sam punkt.
    -->

    <a-entity
      id="exhibition"
      position="0 0 0"
      rotation="0 0 0"
    >


      <!-- ================================== -->
      <!-- MODEL 1                            -->
      <!-- ================================== -->

      <a-entity

        id="sculpture-1"

        gltf-model="#model-1"

        position="0 0 0"

        rotation="0 0 0"

        scale="1 1 1"

      ></a-entity>



      <!-- ================================== -->
      <!-- MODEL 2                            -->
      <!-- ================================== -->

      <a-entity

        id="sculpture-2"

        gltf-model="#model-2"

        position="0 0 0"

        rotation="0 0 0"

        scale="1 1 1"

      ></a-entity>



      <!-- ================================== -->
      <!-- MODEL 3                            -->
      <!-- ================================== -->

      <a-entity

        id="sculpture-3"

        gltf-model="#model-3"

        position="0 0 0"

        rotation="0 0 0"

        scale="1 1 1"

      ></a-entity>


    </a-entity>


  </a-marker>



  <!-- ====================================== -->
  <!-- KAMERA                                 -->
  <!-- ====================================== -->

  <a-entity camera></a-entity>


</a-scene>



<script>

  /* ======================================== */
  /* ELEMENTY                                 */
  /* ======================================== */

  const marker =
    document.querySelector(
      "#hiro-marker"
    );


  const status =
    document.querySelector(
      "#status"
    );


  const info =
    document.querySelector(
      "#info"
    );


  const debug =
    document.querySelector(
      "#debug"
    );


  const containButton =
    document.querySelector(
      "#contain-button"
    );


  const coverButton =
    document.querySelector(
      "#cover-button"
    );


  let markerVisible =
    false;



  /* ======================================== */
  /* LOGOWANIE MODELI                         */
  /* ======================================== */

  const models = [
    document.querySelector("#sculpture-1"),
    document.querySelector("#sculpture-2"),
    document.querySelector("#sculpture-3")
  ];


  models.forEach((model, index) => {

    model.addEventListener(
      "model-loaded",
      () => {

        console.log(
          "MODEL",
          index + 1,
          "ZAŁADOWANY"
        );

      }
    );


    model.addEventListener(
      "model-error",
      (event) => {

        console.error(
          "BŁĄD MODELU",
          index + 1,
          event
        );

      }
    );

  });



  /* ======================================== */
  /* VIDEO                                    */
  /* ======================================== */

  function getVideo() {

    return document.querySelector(
      "video"
    );

  }



  /* ======================================== */
  /* CONTAIN                                  */
  /* ======================================== */

  function setContain() {

    const video =
      getVideo();


    if (!video) {

      setTimeout(
        setContain,
        100
      );

      return;

    }


    video.style.setProperty(
      "object-fit",
      "contain",
      "important"
    );


    containButton.classList.add(
      "active"
    );


    coverButton.classList.remove(
      "active"
    );

  }



  /* ======================================== */
  /* COVER                                    */
  /* ======================================== */

  function setCover() {

    const video =
      getVideo();


    if (!video) {
      return;
    }


    video.style.setProperty(
      "object-fit",
      "cover",
      "important"
    );


    coverButton.classList.add(
      "active"
    );


    containButton.classList.remove(
      "active"
    );

  }



  /* ======================================== */
  /* BUTTONS                                  */
  /* ======================================== */

  containButton.addEventListener(
    "click",
    setContain
  );


  coverButton.addEventListener(
    "click",
    setCover
  );



  /* ======================================== */
  /* HIRO FOUND                               */
  /* ======================================== */

  marker.addEventListener(

    "markerFound",

    () => {

      markerVisible =
        true;


      status.innerHTML =
        "✓ HIRO ZNALEZIONY";


      info.innerHTML =
        "3 modele ustawione w punkcie markera.";

    }

  );



  /* ======================================== */
  /* HIRO LOST                                */
  /* ======================================== */

  marker.addEventListener(

    "markerLost",

    () => {

      markerVisible =
        false;


      status.innerHTML =
        "⚠ HIRO POZA KADREM";


      info.innerHTML =
        "Skieruj kamerę ponownie na marker.";

    }

  );



  /* ======================================== */
  /* DEBUG                                    */
  /* ======================================== */

  setInterval(

    () => {

      const video =
        getVideo();


      if (!video) {

        debug.innerHTML =
          "czekam na kamerę...";

        return;

      }


      debug.innerHTML =

        "marker: " +

        (
          markerVisible
            ? "TAK"
            : "NIE"
        ) +

        "<br>" +

        "kamera: " +

        (video.videoWidth || 0) +

        " × " +

        (video.videoHeight || 0) +

        "<br>" +

        "ekran: " +

        window.innerWidth +

        " × " +

        window.innerHeight;

    },

    300

  );



  /* ======================================== */
  /* WYMUSZENIE CONTAIN                       */
  /* ======================================== */

  window.addEventListener(

    "load",

    () => {

      setTimeout(
        setContain,
        500
      );


      setTimeout(
        setContain,
        1500
      );


      setTimeout(
        setContain,
        3000
      );

    }

  );



  /* ======================================== */
  /* RESIZE                                   */
  /* ======================================== */

  window.addEventListener(

    "resize",

    () => {

      setTimeout(
        setContain,
        100
      );

    }

  );

</script>


</body>
</html>
