<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>AR HIRO Exhibition</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 9999;

      padding: 14px 16px;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      text-align: center;
      font-size: 14px;
      line-height: 1.4;

      pointer-events: none;
    }

    #status {
      font-weight: bold;
      font-size: 16px;
    }

    #debug {
      margin-top: 8px;
      font-family: monospace;
      font-size: 12px;
      opacity: 0.8;
    }

    #reset {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      border: 0;
      border-radius: 12px;

      padding: 14px 22px;

      background: white;
      color: black;

      font-size: 15px;
      font-weight: bold;

      display: none;

      pointer-events: auto;
    }
  </style>
</head>

<body>

<div id="ui">
  <div id="status">
    Szukam markera HIRO...
  </div>

  <div id="debug">
    marker: niewidoczny
  </div>
</div>

<button id="reset">
  USTAW PONOWNIE
</button>


<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="
    antialias: true;
    alpha: true;
    colorManagement: true;
    physicallyCorrectLights: true;
  "
  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
    trackingMethod: best;
  "
>

  <!-- ===================================================== -->
  <!-- ŚWIATŁO                                              -->
  <!-- ===================================================== -->

  <a-entity
    light="
      type: ambient;
      intensity: 1.2;
    "
  ></a-entity>

  <a-entity
    light="
      type: directional;
      intensity: 1.5;
    "
    position="1 4 2"
  ></a-entity>


  <!-- ===================================================== -->
  <!-- MARKER HIRO                                           -->
  <!-- ===================================================== -->

  <!--
    Ten obiekt służy TYLKO do wykrycia markera.

    Rzeźby NIE są jego dziećmi.

    Po wykryciu HIRO kopiujemy jego pozycję
    i obrót do exhibitionRoot.
  -->

  <a-marker
    id="hiro"
    preset="hiro"
    emitevents="true"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >

    <!--
      Ten mały zielony obiekt istnieje tylko po to,
      żeby było widać, że marker jest śledzony.
    -->

    <a-box
      position="0 0.05 0"
      scale="0.12 0.10 0.12"
      color="#00ff66"
    ></a-box>

  </a-marker>


  <!-- ===================================================== -->
  <!-- WYSTAWA                                               -->
  <!-- ===================================================== -->

  <!--
    UWAGA:

    exhibitionRoot NIE jest wewnątrz <a-marker>.

    To bardzo ważne.

    Po pierwszym wykryciu HIRO ustawiamy
    exhibitionRoot w pozycji markera.

    Potem marker może zniknąć.
  -->

  <a-entity
    id="exhibitionRoot"
    visible="false"
  >


    <!-- =================================================== -->
    <!-- PUNKT ZERO                                         -->
    <!-- =================================================== -->

    <a-cylinder
      position="0 0.01 0"
      radius="0.12"
      height="0.02"
      color="#ffffff"
    ></a-cylinder>


    <!-- =================================================== -->
    <!-- RZEŹBA 1                                           -->
    <!-- =================================================== -->

    <!--
      Czerwony słup.

      80 cm przed HIRO.
    -->

    <a-box
      position="0 0.4 -0.8"
      width="0.3"
      height="0.8"
      depth="0.3"
      color="#ff3333"
    ></a-box>


    <!-- =================================================== -->
    <!-- RZEŹBA 2                                           -->
    <!-- =================================================== -->

    <!--
      Niebieska kula.
    -->

    <a-sphere
      position="-0.7 0.25 -1.3"
      radius="0.25"
      color="#3388ff"
      segments-width="32"
      segments-height="24"
    ></a-sphere>


    <!-- =================================================== -->
    <!-- RZEŹBA 3                                           -->
    <!-- =================================================== -->

    <!--
      Zielony słup.
    -->

    <a-cylinder
      position="0.8 0.6 -1.5"
      radius="0.18"
      height="1.2"
      color="#33dd77"
      segments-radial="32"
    ></a-cylinder>


    <!-- =================================================== -->
    <!-- RZEŹBA 4                                           -->
    <!-- =================================================== -->

    <!--
      Żółty torus.
    -->

    <a-torus
      position="-0.5 0.6 -2.2"
      rotation="90 0 0"
      radius="0.35"
      radius-tubular="0.10"
      color="#ffcc22"
    ></a-torus>


    <!-- =================================================== -->
    <!-- RZEŹBA 5                                           -->
    <!-- =================================================== -->

    <!--
      Fioletowy stożek.
    -->

    <a-cone
      position="0.7 0.5 -2.5"
      radius-bottom="0.35"
      radius-top="0"
      height="1"
      color="#cc44ff"
    ></a-cone>


    <!-- =================================================== -->
    <!-- RZEŹBA 6                                           -->
    <!-- =================================================== -->

    <!--
      Turkusowy box.
    -->

    <a-box
      position="0 0.35 -3.2"
      rotation="0 45 0"
      width="0.7"
      height="0.7"
      depth="0.7"
      color="#00dddd"
    ></a-box>


  </a-entity>


  <!-- ===================================================== -->
  <!-- KAMERA                                                -->
  <!-- ===================================================== -->

  <a-entity camera></a-entity>

</a-scene>


<script>
  const marker = document.getElementById("hiro");
  const exhibition = document.getElementById("exhibitionRoot");

  const status = document.getElementById("status");
  const debug = document.getElementById("debug");
  const resetButton = document.getElementById("reset");


  let calibrated = false;


  // =========================================================
  // MARKER FOUND
  // =========================================================

  marker.addEventListener("markerFound", () => {

    debug.textContent = "marker: WIDOCZNY";

    if (calibrated) {
      return;
    }

    status.textContent =
      "HIRO znaleziony — ustawiam wystawę...";


    /*
      Dajemy trackerowi kilka klatek,
      żeby pozycja markera się uspokoiła.
    */

    setTimeout(() => {

      if (calibrated) {
        return;
      }

      calibrateExhibition();

    }, 500);

  });


  // =========================================================
  // MARKER LOST
  // =========================================================

  marker.addEventListener("markerLost", () => {

    debug.textContent = "marker: niewidoczny";

    if (!calibrated) {

      status.textContent =
        "Szukam markera HIRO...";

    } else {

      status.textContent =
        "Wystawa ustawiona — marker nie jest już potrzebny.";

    }

  });


  // =========================================================
  // KALIBRACJA
  // =========================================================

  function calibrateExhibition() {

    /*
      Pobieramy obiekty Three.js,
      które stoją pod elementami A-Frame.
    */

    const markerObject = marker.object3D;
    const exhibitionObject = exhibition.object3D;


    /*
      Wymuszamy aktualizację macierzy.
    */

    markerObject.updateMatrixWorld(true);


    /*
      Pobieramy WORLD POSITION markera.
    */

    const worldPosition = new THREE.Vector3();

    markerObject.getWorldPosition(
      worldPosition
    );


    /*
      Pobieramy WORLD ROTATION markera.
    */

    const worldQuaternion = new THREE.Quaternion();

    markerObject.getWorldQuaternion(
      worldQuaternion
    );


    /*
      Kopiujemy pozycję HIRO
      do korzenia wystawy.
    */

    exhibitionObject.position.copy(
      worldPosition
    );


    /*
      Kopiujemy również jego orientację.

      Dzięki temu góra wydrukowanego HIRO
      zawsze definiuje ten sam kierunek
      wystawy.
    */

    exhibitionObject.quaternion.copy(
      worldQuaternion
    );


    /*
      Pokazujemy wystawę.
    */

    exhibition.setAttribute(
      "visible",
      true
    );


    calibrated = true;


    status.innerHTML =
      "WYSTAWA USTAWIONA<br>" +
      "Możesz odejść od HIRO.";


    resetButton.style.display =
      "block";


    console.log(
      "HIRO position:",
      worldPosition
    );


    console.log(
      "HIRO rotation:",
      worldQuaternion
    );

  }


  // =========================================================
  // RESET
  // =========================================================

  resetButton.addEventListener("click", () => {

    calibrated = false;


    exhibition.setAttribute(
      "visible",
      false
    );


    status.textContent =
      "Szukam markera HIRO...";


    resetButton.style.display =
      "none";

  });

</script>

</body>
</html>
```
