<style>

<!-- ======================================= -->
<!-- THREE.JS                                -->
<!-- ======================================= -->

<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";


/* ========================================= */
/* HTML                                      */
/* ========================================= */

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("start-button");

const instruction =
  document.getElementById("instruction");

const debug =
  document.getElementById("debug");

const distanceText =
  document.getElementById("distance");

const errorScreen =
  document.getElementById("error");

const errorText =
  document.getElementById("error-text");



/* ========================================= */
/* SCENA                                     */
/* ========================================= */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
  );



/* ========================================= */
/* RENDERER                                  */
/* ========================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.xr.enabled = true;


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.2;


document.body.appendChild(
  renderer.domElement
);



/* ========================================= */
/* ŚWIATŁO                                   */
/* ========================================= */

const hemisphere =
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    3
  );


scene.add(
  hemisphere
);



const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );


sun.position.set(
  2,
  5,
  3
);


scene.add(
  sun
);



/* ========================================= */
/* RETICLE                                   */
/* ========================================= */

const reticleGeometry =
  new THREE.RingGeometry(
    0.08,
    0.11,
    40
  );


reticleGeometry.rotateX(
  -Math.PI / 2
);


const reticleMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xffffff
  });


const reticle =
  new THREE.Mesh(
    reticleGeometry,
    reticleMaterial
  );


reticle.matrixAutoUpdate = false;

reticle.visible = false;


scene.add(
  reticle
);



/* ========================================= */
/* WYSTAWA                                   */
/* ========================================= */

/*
  To jest rodzic WSZYSTKICH obiektów.

  Jego pozycja = punkt dotknięcia podłogi.

  Wszystkie rzeźby mają pozycję
  RELATYWNĄ względem niego.
*/

const exhibition =
  new THREE.Group();


exhibition.visible = false;


scene.add(
  exhibition
);



/* ========================================= */
/* MATERIAŁY                                 */
/* ========================================= */

function material(color) {

  return new THREE.MeshStandardMaterial({

    color: color,

    roughness: 0.45,

    metalness: 0.08

  });

}



/* ========================================= */
/* RZEŹBA 1                                  */
/* ========================================= */

/*
       █
       █
       █

  80 cm przed punktem startowym.
*/

const sculpture1 =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      0.3,
      0.8,
      0.3
    ),

    material(
      0xff3333
    )

  );


sculpture1.position.set(

  0,
  0.4,
  -0.8

);


exhibition.add(
  sculpture1
);



/* ========================================= */
/* RZEŹBA 2                                  */
/* ========================================= */

/*
  Kula po lewej.
*/

const sculpture2 =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      0.25,
      32,
      32
    ),

    material(
      0x3388ff
    )

  );


sculpture2.position.set(

  -0.7,
  0.25,
  -1.3

);


exhibition.add(
  sculpture2
);



/* ========================================= */
/* RZEŹBA 3                                  */
/* ========================================= */

/*
  Wysoki słup po prawej.
*/

const sculpture3 =
  new THREE.Mesh(

    new THREE.CylinderGeometry(
      0.18,
      0.18,
      1.2,
      32
    ),

    material(
      0x33dd77
    )

  );


sculpture3.position.set(

  0.8,
  0.6,
  -1.5

);


exhibition.add(
  sculpture3
);



/* ========================================= */
/* RZEŹBA 4                                  */
/* ========================================= */

/*
  Torus trochę dalej.
*/

const sculpture4 =
  new THREE.Mesh(

    new THREE.TorusGeometry(
      0.35,
      0.1,
      20,
      50
    ),

    material(
      0xffcc22
    )

  );


sculpture4.position.set(

  -0.5,
  0.6,
  -2.2

);


sculpture4.rotation.x =
  Math.PI / 2;


exhibition.add(
  sculpture4
);



/* ========================================= */
/* RZEŹBA 5                                  */
/* ========================================= */

/*
  Stożek.
*/

const sculpture5 =
  new THREE.Mesh(

    new THREE.ConeGeometry(
      0.35,
      1,
      32
    ),

    material(
      0xcc44ff
    )

  );


sculpture5.position.set(

  0.7,
  0.5,
  -2.5

);


exhibition.add(
  sculpture5
);



/* ========================================= */
/* RZEŹBA 6                                  */
/* ========================================= */

/*
  Duży box dalej.
*/

const sculpture6 =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      0.7,
      0.7,
      0.7
    ),

    material(
      0x00dddd
    )

  );


sculpture6.position.set(

  0,
  0.35,
  -3.2

);


sculpture6.rotation.y =
  Math.PI / 4;


exhibition.add(
  sculpture6
);



/* ========================================= */
/* PUNKT ZERO                                */
/* ========================================= */

/*
  Mały ring pokazujący punkt,
  od którego liczona jest wystawa.
*/

const originGeometry =
  new THREE.RingGeometry(
    0.15,
    0.18,
    40
  );


originGeometry.rotateX(
  -Math.PI / 2
);


const origin =
  new THREE.Mesh(

    originGeometry,

    new THREE.MeshBasicMaterial({
      color: 0xffffff
    })

  );


origin.position.y =
  0.005;


exhibition.add(
  origin
);



/* ========================================= */
/* WEBXR                                     */
/* ========================================= */

let session = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let exhibitionPlaced = false;



/* ========================================= */
/* TRACKING DEBUG                            */
/* ========================================= */

const initialCameraPosition =
  new THREE.Vector3();


const currentCameraPosition =
  new THREE.Vector3();


let initialPositionSaved =
  false;



/* ========================================= */
/* START                                     */
/* ========================================= */

async function startAR() {


  if (!navigator.xr) {

    showError(
      "Ta przeglądarka nie obsługuje WebXR."
    );

    return;

  }


  try {


    const supported =
      await navigator.xr.isSessionSupported(
        "immersive-ar"
      );


    if (!supported) {

      showError(
        "To urządzenie nie obsługuje immersive-ar."
      );

      return;

    }



    session =
      await navigator.xr.requestSession(

        "immersive-ar",

        {

          requiredFeatures: [
            "hit-test"
          ],

          optionalFeatures: [
            "local-floor",
            "dom-overlay"
          ],

          domOverlay: {
            root: document.body
          }

        }

      );



    /* ===================================== */
    /* WAŻNE                                */
    /* ===================================== */

    /*
      Używamy dokładnie tego samego
      reference space co w działającym
      teście 6DoF.
    */

    renderer.xr.setReferenceSpaceType(
      "local"
    );


    await renderer.xr.setSession(
      session
    );


    referenceSpace =
      renderer.xr.getReferenceSpace();


    viewerSpace =
      await session.requestReferenceSpace(
        "viewer"
      );


    hitTestSource =
      await session.requestHitTestSource({

        space: viewerSpace

      });



    session.addEventListener(
      "select",
      placeExhibition
    );


    session.addEventListener(
      "end",
      endSession
    );



    start.style.display =
      "none";


    instruction.style.display =
      "block";


    debug.style.display =
      "block";


    renderer.setAnimationLoop(
      render
    );


  }

  catch(error) {


    console.error(error);


    showError(

      "Nie udało się uruchomić AR. " +
      "Sprawdź HTTPS i uprawnienia."

    );

  }

}



/* ========================================= */
/* POSTAW WYSTAWĘ                            */
/* ========================================= */

function placeExhibition() {


  if (!reticle.visible) {

    return;

  }


  if (exhibitionPlaced) {

    return;

  }



  /*
    Pobieramy pozycję reticle
    bezpośrednio z hit-testu.
  */

  const hitPosition =
    new THREE.Vector3();


  hitPosition.setFromMatrixPosition(
    reticle.matrix
  );



  /*
    CAŁA WYSTAWA zostaje przyklejona
    do tego miejsca w local reference space.
  */

  exhibition.position.copy(
    hitPosition
  );



  /* ===================================== */
  /* OBRÓT WYSTAWY                         */
  /* ===================================== */

  /*
    Sprawdzamy kierunek patrzenia
    w momencie ustawiania wystawy.

    Dzięki temu obiekty pojawią się
    "przed użytkownikiem".
  */

  const xrCamera =
    renderer.xr.getCamera(
      camera
    );


  const direction =
    new THREE.Vector3();


  xrCamera.getWorldDirection(
    direction
  );


  direction.y = 0;


  if (
    direction.lengthSq() > 0
  ) {

    direction.normalize();


    const angle =
      Math.atan2(
        direction.x,
        direction.z
      );


    exhibition.rotation.y =
      angle + Math.PI;

  }



  /* ===================================== */
  /* POKAŻ                                 */
  /* ===================================== */

  exhibition.visible =
    true;


  exhibitionPlaced =
    true;


  reticle.visible =
    false;



  /* ===================================== */
  /* ZAPISZ POZYCJĘ TELEFONU              */
  /* ===================================== */

  xrCamera.getWorldPosition(
    initialCameraPosition
  );


  initialPositionSaved =
    true;



  instruction.innerHTML =

    "Wystawa ustawiona.<br>" +
    "Możesz teraz fizycznie chodzić między obiektami.";

}



/* ========================================= */
/* RENDER                                    */
/* ========================================= */

function render(
  timestamp,
  frame
) {


  /* ===================================== */
  /* HIT TEST                              */
  /* ===================================== */

  if (

    frame &&
    hitTestSource &&
    referenceSpace &&
    !exhibitionPlaced

  ) {


    const results =
      frame.getHitTestResults(
        hitTestSource
      );


    if (
      results.length > 0
    ) {


      const hit =
        results[0];


      const pose =
        hit.getPose(
          referenceSpace
        );


      if (pose) {


        reticle.visible =
          true;


        reticle.matrix.fromArray(
          pose.transform.matrix
        );


        instruction.innerHTML =

          "Podłoga wykryta.<br>" +
          "Dotknij ekranu, aby ustawić wystawę.";

      }

    }


    else {


      reticle.visible =
        false;


      instruction.innerHTML =

        "Szukam podłogi...<br>" +
        "Poruszaj telefonem powoli.";

    }

  }



  /* ===================================== */
  /* DEBUG RUCHU                           */
  /* ===================================== */

  if (

    frame &&
    referenceSpace &&
    initialPositionSaved

  ) {


    /*
      Tak samo jak w naszym
      działającym teście 6DoF.

      Pobieramy pose bezpośrednio
      z WebXR.
    */

    const viewerPose =
      frame.getViewerPose(
        referenceSpace
      );


    if (viewerPose) {


      currentCameraPosition.set(

        viewerPose.transform.position.x,

        viewerPose.transform.position.y,

        viewerPose.transform.position.z

      );


      const distance =
        currentCameraPosition.distanceTo(
          initialCameraPosition
        );


      distanceText.textContent =
        distance.toFixed(2);

    }

  }



  renderer.render(
    scene,
    camera
  );

}



/* ========================================= */
/* END                                       */
/* ========================================= */

function endSession() {


  session =
    null;


  referenceSpace =
    null;


  viewerSpace =
    null;


  hitTestSource =
    null;


  exhibitionPlaced =
    false;


  initialPositionSaved =
    false;


  exhibition.visible =
    false;


  reticle.visible =
    false;


  distanceText.textContent =
    "0.00";


  renderer.setAnimationLoop(
    null
  );


  instruction.style.display =
    "none";


  debug.style.display =
    "none";


  start.style.display =
    "flex";

}



/* ========================================= */
/* ERROR                                     */
/* ========================================= */

function showError(message) {


  start.style.display =
    "none";


  errorScreen.style.display =
    "flex";


  errorText.textContent =
    message;

}



/* ========================================= */
/* RESIZE                                    */
/* ========================================= */

window.addEventListener(

  "resize",

  () => {


    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }

);



/* ========================================= */
/* BUTTON                                    */
/* ========================================= */

startButton.addEventListener(
  "click",
  startAR
);

</script>

</body>
</html>
