<script type="importmap">
{
  "imports": {

    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

<script type="module">

import * as THREE from "three";



/* ================================================== */
/* HTML                                               */
/* ================================================== */

const startScreen =
  document.getElementById("start-screen");

const startButton =
  document.getElementById("start-ar");

const arUI =
  document.getElementById("ar-ui");

const instruction =
  document.getElementById("instruction");

const status =
  document.getElementById("status");

const errorScreen =
  document.getElementById("error");

const errorText =
  document.getElementById("error-text");



/* ================================================== */
/* SCENA                                              */
/* ================================================== */

const scene =
  new THREE.Scene();



/* ================================================== */
/* KAMERA                                             */
/* ================================================== */

const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
  );



/* ================================================== */
/* RENDERER                                           */
/* ================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,
    alpha: true

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,
  window.innerHeight

);


renderer.xr.enabled = true;


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.2;


document.body.appendChild(

  renderer.domElement

);



/* ================================================== */
/* ŚWIATŁO                                            */
/* ================================================== */

const hemisphereLight =
  new THREE.HemisphereLight(

    0xffffff,
    0x444444,
    2.5

  );


scene.add(
  hemisphereLight
);



const directionalLight =
  new THREE.DirectionalLight(

    0xffffff,
    3

  );


directionalLight.position.set(

  2,
  5,
  2

);


scene.add(
  directionalLight
);



/* ================================================== */
/* RETICLE                                            */
/* ================================================== */

/*
  To jest białe kółko pokazujące
  wykrytą podłogę.
*/

const reticleGeometry =
  new THREE.RingGeometry(

    0.08,
    0.11,
    40

  );


reticleGeometry.rotateX(

  -Math.PI / 2

);


const reticleMaterial =
  new THREE.MeshBasicMaterial({

    color: 0xffffff

  });


const reticle =
  new THREE.Mesh(

    reticleGeometry,
    reticleMaterial

  );


reticle.matrixAutoUpdate = false;

reticle.visible = false;


scene.add(
  reticle
);



/* ================================================== */
/* ROOT CAŁEJ WYSTAWY                                 */
/* ================================================== */

/*
  Wszystkie boxy znajdują się
  wewnątrz exhibition.

  Po dotknięciu ekranu przesuwamy
  cały exhibition do punktu
  wykrytego na podłodze.
*/

const exhibition =
  new THREE.Group();


exhibition.visible = false;


scene.add(
  exhibition
);



/* ================================================== */
/* FUNKCJA TWORZĄCA BOX                               */
/* ================================================== */

function createBox(

  x,
  y,
  z,

  width,
  height,
  depth,

  color

) {


  const geometry =
    new THREE.BoxGeometry(

      width,
      height,
      depth

    );


  const material =
    new THREE.MeshStandardMaterial({

      color: color,

      roughness: 0.55,

      metalness: 0.05

    });


  const box =
    new THREE.Mesh(

      geometry,
      material

    );


  /*
    y + height / 2 sprawia,
    że box stoi NA PODŁODZE,
    zamiast być w połowie pod nią.
  */

  box.position.set(

    x,
    y + height / 2,
    z

  );


  exhibition.add(
    box
  );


  return box;

}



/* ================================================== */
/* TESTOWE BOXY                                       */
/* ================================================== */

/*
  Jednostki Three.js w WebXR
  odpowiadają mniej więcej metrom.

  Czyli:

  z = -2

  oznacza około 2 metry przed
  punktem startowym.
*/


/* BOX 1 */

createBox(
  0,
  0,
  -0.7,

  0.25,
  0.50,
  0.25,

  0xff3333
);


// BOX LEWY
// około 1 metr przed punktem

createBox(
  -0.45,
  0,
  -1.0,

  0.25,
  0.25,
  0.25,

  0x33ff88
);


// BOX PRAWY

createBox(
  0.45,
  0,
  -1.0,

  0.25,
  0.70,
  0.25,

  0x3399ff
);


// BOX DALEJ

createBox(
  0,
  0,
  -1.5,

  0.35,
  0.35,
  0.35,

  0xffcc33
);


/* ================================================== */
/* DODATKOWA PODSTAWA                                 */
/* ================================================== */

/*
  Mały ciemny kwadrat przy początku
  wystawy, żeby było łatwo zobaczyć
  punkt odniesienia.
*/

const baseGeometry =
  new THREE.BoxGeometry(

    1,
    0.05,
    1

  );


const baseMaterial =
  new THREE.MeshStandardMaterial({

    color: 0x222222

  });


const base =
  new THREE.Mesh(

    baseGeometry,
    baseMaterial

  );


base.position.set(

  0,
  0.025,
  0

);


exhibition.add(
  base
);



/* ================================================== */
/* WEBXR                                              */
/* ================================================== */

let session = null;

let hitTestSource = null;

let referenceSpace = null;

let viewerSpace = null;

let exhibitionPlaced = false;



/* ================================================== */
/* SPRAWDŹ CZY AR DZIAŁA                              */
/* ================================================== */

async function checkXR() {


  if (!navigator.xr) {

    showError(

      "Ta przeglądarka nie obsługuje WebXR. " +
      "Otwórz stronę w Chrome na kompatybilnym " +
      "telefonie z Androidem."

    );

    return false;

  }


  try {

    const supported =
      await navigator.xr.isSessionSupported(

        "immersive-ar"

      );


    if (!supported) {

      showError(

        "Twoje urządzenie nie obsługuje " +
        "trybu immersive-ar."

      );

      return false;

    }


    return true;

  }

  catch (error) {

    console.error(error);


    showError(

      "Nie udało się sprawdzić obsługi WebXR."

    );


    return false;

  }

}



/* ================================================== */
/* START AR                                           */
/* ================================================== */

async function startAR() {


  const supported =
    await checkXR();


  if (!supported) {

    return;

  }


  try {


    session =
      await navigator.xr.requestSession(

        "immersive-ar",

        {

          requiredFeatures: [

            "hit-test"

          ],

          optionalFeatures: [

            "dom-overlay",
            "local-floor"

          ],

          domOverlay: {

            root: document.body

          }

        }

      );



    /*
      Podpinamy sesję XR
      do renderera Three.js.
    */

    await renderer.xr.setSession(

      session

    );



    startScreen.style.display =
      "none";


    arUI.style.display =
      "block";



    /*
      Local reference space
      utrzymuje obiekty w świecie
      podczas sesji AR.
    */

    referenceSpace =
      await session.requestReferenceSpace(

        "local"

      );



    /*
      Viewer space jest potrzebne
      do hit-testu.
    */

    viewerSpace =
      await session.requestReferenceSpace(

        "viewer"

      );



    /*
      Tworzymy źródło hit-test.
    */

    hitTestSource =
      await session.requestHitTestSource({

        space: viewerSpace

      });



    /*
      "select" = tapnięcie ekranu
      podczas sesji AR.
    */

    session.addEventListener(

      "select",
      placeExhibition

    );



    session.addEventListener(

      "end",
      onSessionEnd

    );



    renderer.setAnimationLoop(

      render

    );


  }

  catch (error) {


    console.error(error);


    showError(

      "Nie udało się uruchomić AR.<br><br>" +
      "Sprawdź uprawnienia kamery oraz czy " +
      "strona działa przez HTTPS."

    );

  }

}



/* ================================================== */
/* USTAWIENIE WYSTAWY                                */
/* ================================================== */

function placeExhibition() {


  /*
    Nie ma wykrytej powierzchni.
  */

  if (!reticle.visible) {

    return;

  }


  /*
    Wystawę ustawiamy tylko raz.
  */

  if (exhibitionPlaced) {

    return;

  }



  /* ============================== */
  /* POZYCJA                        */
  /* ============================== */

  const position =
    new THREE.Vector3();


  position.setFromMatrixPosition(

    reticle.matrix

  );


  exhibition.position.copy(

    position

  );



  /* ============================== */
  /* KIERUNEK                       */
  /* ============================== */

  /*
    Pobieramy kierunek,
    w którym patrzy telefon.
  */

  const xrCamera =
    renderer.xr.getCamera(

      camera

    );


  const direction =
    new THREE.Vector3();


  xrCamera.getWorldDirection(

    direction

  );


  /*
    Ignorujemy patrzenie
    góra / dół.
  */

  direction.y = 0;


  direction.normalize();



  /*
    Obliczamy obrót wystawy.
  */

  const angle =
    Math.atan2(

      direction.x,
      direction.z

    );


  exhibition.rotation.set(

    0,
    angle + Math.PI,
    0

  );



  /* ============================== */
  /* POKAŻ WYSTAWĘ                  */
  /* ============================== */

  exhibition.visible =
    true;


  exhibitionPlaced =
    true;


  reticle.visible =
    false;



  instruction.innerHTML =

    "Wystawa ustawiona.<br>" +
    "Idź do przodu i chodź między boxami.";


  status.innerHTML =

    "AR aktywne";

}



/* ================================================== */
/* RENDER LOOP                                        */
/* ================================================== */

function render(

  timestamp,
  frame

) {


  /*
    Hit-test wykonujemy tylko
    przed ustawieniem wystawy.
  */

  if (

    frame &&
    hitTestSource &&
    referenceSpace &&
    !exhibitionPlaced

  ) {


    const hitTestResults =
      frame.getHitTestResults(

        hitTestSource

      );



    /* ============================== */
    /* ZNALEZIONO PODŁOGĘ             */
    /* ============================== */

    if (

      hitTestResults.length > 0

    ) {


      const hit =
        hitTestResults[0];


      const pose =
        hit.getPose(

          referenceSpace

        );



      if (pose) {


        reticle.visible =
          true;


        reticle.matrix.fromArray(

          pose.transform.matrix

        );


        status.innerHTML =

          "Powierzchnia wykryta";


        instruction.innerHTML =

          "Dotknij ekranu, aby ustawić wystawę.";

      }

    }


    /* ============================== */
    /* BRAK PODŁOGI                   */
    /* ============================== */

    else {


      reticle.visible =
        false;


      status.innerHTML =

        "Szukanie powierzchni...";


      instruction.innerHTML =

        "Skieruj telefon na podłogę " +
        "i poruszaj nim powoli.";

    }

  }



  /* ============================== */
  /* RENDER                         */
  /* ============================== */

  renderer.render(

    scene,
    camera

  );

}



/* ================================================== */
/* KONIEC SESJI                                       */
/* ================================================== */

function onSessionEnd() {


  session =
    null;


  hitTestSource =
    null;


  referenceSpace =
    null;


  viewerSpace =
    null;


  exhibitionPlaced =
    false;


  exhibition.visible =
    false;


  reticle.visible =
    false;


  renderer.setAnimationLoop(

    null

  );


  arUI.style.display =
    "none";


  startScreen.style.display =
    "flex";

}



/* ================================================== */
/* ERROR                                              */
/* ================================================== */

function showError(message) {


  startScreen.style.display =
    "none";


  errorScreen.style.display =
    "flex";


  errorText.innerHTML =
    message;

}



/* ================================================== */
/* RESIZE                                             */
/* ================================================== */

window.addEventListener(

  "resize",

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,
      window.innerHeight

    );

  }

);



/* ================================================== */
/* START BUTTON                                       */
/* ================================================== */

startButton.addEventListener(

  "click",
  startAR

);

</script>

</body>
</html>
