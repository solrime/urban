<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Zakodowane we wzorach</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* ========================================= */
/* START                                     */
/* ========================================= */

#start {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: #111;
  color: white;
  text-align: center;
}

#start-inner {
  width: 100%;
  max-width: 420px;
}

#start h1 {
  margin: 0 0 15px;
  font-size: 32px;
}

#start p {
  margin: 0 0 25px;
  opacity: 0.75;
  font-size: 16px;
  line-height: 1.5;
}

#start-button {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 14px;
  background: white;
  color: black;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

/* ========================================= */
/* INFO                                      */
/* ========================================= */

#instruction {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: none;
  width: calc(100% - 30px);
  max-width: 450px;
  padding: 14px 18px;
  border-radius: 14px;
  background: rgba(0,0,0,0.72);
  color: white;
  text-align: center;
  font-size: 14px;
  line-height: 1.4;
  pointer-events: none;
}

/* ========================================= */
/* ERROR                                     */
/* ========================================= */

#error {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: #111;
  color: white;
  text-align: center;
}
</style>
</head>

<body>

<!-- ======================================= -->
<!-- START                                   -->
<!-- ======================================= -->

<div id="start">

  <div id="start-inner">

    <h1>Wystawa AR</h1>

    <p>
      Skieruj telefon na podłogę.
      <br><br>

      Kiedy pojawi się białe kółko na podłodze,
      dotknij ekranu.
      <br><br>

      Punkt można ustawić tylko raz.
    </p>

    <button id="start-button">
      URUCHOM WYSTAWĘ
    </button>

  </div>

</div>


<!-- ======================================= -->
<!-- INFO                                    -->
<!-- ======================================= -->

<div id="instruction">
  Szukam podłogi...
</div>


<!-- ======================================= -->
<!-- ERROR                                   -->
<!-- ======================================= -->

<div id="error">

  <div>

    <h2>AR niedostępne</h2>

    <p id="error-text"></p>

  </div>

</div>


<!-- ======================================= -->
<!-- THREE.JS                                -->
<!-- ======================================= -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* ========================================= */
/* HTML                                      */
/* ========================================= */

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("start-button");

const instruction =
  document.getElementById("instruction");

const errorScreen =
  document.getElementById("error");

const errorText =
  document.getElementById("error-text");


/* ========================================= */
/* MODELE                                    */
/* ========================================= */

const models = [

  /* ======================================= */
  /* RZEŹBA 1  (BIAŁY LUDZIK)               */
  /* ======================================= */

  {
    url:
      "https://cdn.tinyglb.com/models/7f210788d6204cf09324b3655d9bead3.glb",

    position: {
      x: 5.5,
      y: 4.5,
      z: 0
    },

    scale: 7,

    rotation: {
      x: 0,
      y: 0.5,
      z: 0
    }
  },


  /* ======================================= */
  /* RZEŹBA 2  (CZERWONY LUDZIK)             */
  /* ======================================= */

  {
    url:
      "https://cdn.tinyglb.com/models/778255d1a4ea48e8b0d28b870625a541.glb",

    position: {
      x: -5,
      y: 1,
      z: 0
    },

    scale: 7,

    rotation: {
      x: 0,
      y: 0.5,
      z: 0
    }
  },


  /* ======================================= */
  /* RZEŹBA 3                                */
  /* ======================================= */

  {
    url:
      "https://cdn.tinyglb.com/models/d0b8347d52844ca1a2b58121fb976274.glb",

    position: {
      x: 0,
      y: 0,
      z: 0
    },

    scale: 11.5,

    rotation: {
      x: 0,
      y: 0,
      z: 0
    }
  }

];


/* ========================================= */
/* SCENA                                     */
/* ========================================= */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.01,
    100
  );


/* ========================================= */
/* RENDERER                                  */
/* ========================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.xr.enabled =
  true;


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.2;


document.body.appendChild(
  renderer.domElement
);


/* ========================================= */
/* ŚWIATŁO                                   */
/* ========================================= */

const hemisphere =
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    3
  );


scene.add(
  hemisphere
);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );


sun.position.set(
  2,
  5,
  3
);


scene.add(
  sun
);


/* ========================================= */
/* RETICLE                                   */
/* ========================================= */

const reticleGeometry =
  new THREE.RingGeometry(
    0.08,
    0.11,
    40
  );


reticleGeometry.rotateX(
  -Math.PI / 2
);


const reticleMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xffffff
  });


const reticle =
  new THREE.Mesh(
    reticleGeometry,
    reticleMaterial
  );


reticle.matrixAutoUpdate =
  false;


reticle.visible =
  false;


scene.add(
  reticle
);


/* ========================================= */
/* WYSTAWA                                   */
/* ========================================= */

const exhibition =
  new THREE.Group();


exhibition.visible =
  false;


scene.add(
  exhibition
);


/* ========================================= */
/* GLTF LOADER                               */
/* ========================================= */

const loader =
  new GLTFLoader();


/* ========================================= */
/* ANIMACJE                                  */
/* ========================================= */

const mixers = [];

let lastTimestamp =
  null;


/* ========================================= */
/* SHADE FLAT                                */
/* ========================================= */

function applyFlatShading(model) {

  model.traverse(
    (child) => {

      if (!child.isMesh) {
        return;
      }


      child.castShadow =
        true;


      child.receiveShadow =
        true;


      const materials =
        Array.isArray(child.material)
          ? child.material
          : [child.material];


      materials.forEach(
        (mat) => {

          if (!mat) {
            return;
          }


          mat.flatShading =
            true;


          mat.needsUpdate =
            true;

        }
      );

    }
  );

}


/* ========================================= */
/* URUCHOM ANIMACJE MODELU                   */
/* ========================================= */

function startModelAnimations(
  gltf,
  model,
  number
) {

  if (
    !gltf.animations ||
    gltf.animations.length === 0
  ) {

    console.warn(
      "Model " +
      number +
      " nie zawiera animacji."
    );

    return;

  }


  const mixer =
    new THREE.AnimationMixer(
      model
    );


  mixers.push(
    mixer
  );


  gltf.animations.forEach(
    (clip, index) => {

      console.log(
        "MODEL " +
        number +
        " / ANIMACJA " +
        (index + 1),
        {
          name: clip.name,
          duration: clip.duration,
          tracks: clip.tracks.length
        }
      );


      const action =
        mixer.clipAction(
          clip
        );


      action.reset();


      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      action.enabled =
        true;


      action.paused =
        false;


      action.clampWhenFinished =
        false;


      action.setEffectiveWeight(
        1
      );


      action.setEffectiveTimeScale(
        1
      );


      action.play();

    }
  );

}


/* ========================================= */
/* WCZYTAJ JEDEN MODEL                       */
/* ========================================= */

async function loadModel(
  config,
  number
) {

  try {

    const gltf =
      await loader.loadAsync(
        config.url
      );


    const model =
      gltf.scene;


    console.log(
      "GLTF MODEL " + number,
      gltf
    );


    console.log(
      "ANIMACJE MODELU " + number,
      gltf.animations
    );


    applyFlatShading(
      model
    );


    model.position.set(
      config.position.x,
      config.position.y,
      config.position.z
    );


    model.scale.setScalar(
      config.scale
    );


    model.rotation.set(

      THREE.MathUtils.degToRad(
        config.rotation.x
      ),

      THREE.MathUtils.degToRad(
        config.rotation.y
      ),

      THREE.MathUtils.degToRad(
        config.rotation.z
      )

    );


    exhibition.add(
      model
    );


    startModelAnimations(
      gltf,
      model,
      number
    );


    console.log(
      "Model " +
      number +
      " załadowany."
    );

  }

  catch(error) {

    console.error(
      "Błąd modelu " +
      number,
      error
    );

  }

}


/* ========================================= */
/* WCZYTAJ WSZYSTKIE MODELE                  */
/* ========================================= */

models.forEach(
  (config, index) => {

    loadModel(
      config,
      index + 1
    );

  }
);


/* ========================================= */
/* PUNKT ZERO                                */
/* ========================================= */

const originGeometry =
  new THREE.RingGeometry(
    0.15,
    0.18,
    40
  );


originGeometry.rotateX(
  -Math.PI / 2
);


const origin =
  new THREE.Mesh(

    originGeometry,

    new THREE.MeshBasicMaterial({
      color: 0xffffff
    })

  );


origin.position.y =
  0.005;


exhibition.add(
  origin
);


/* ========================================= */
/* WEBXR                                     */
/* ========================================= */

let session =
  null;


let referenceSpace =
  null;


let viewerSpace =
  null;


let hitTestSource =
  null;


let exhibitionPlaced =
  false;


/* ========================================= */
/* START AR                                  */
/* ========================================= */

async function startAR() {

  if (!navigator.xr) {

    showError(
      "Ta przeglądarka nie obsługuje WebXR."
    );

    return;

  }


  try {

    const supported =
      await navigator.xr.isSessionSupported(
        "immersive-ar"
      );


    if (!supported) {

      showError(
        "To urządzenie nie obsługuje immersive-ar."
      );

      return;

    }


    session =
      await navigator.xr.requestSession(
        "immersive-ar",
        {

          requiredFeatures: [
            "hit-test"
          ],

          optionalFeatures: [
            "local-floor",
            "dom-overlay"
          ],

          domOverlay: {
            root:
              document.body
          }

        }
      );


    renderer.xr.setReferenceSpaceType(
      "local"
    );


    await renderer.xr.setSession(
      session
    );


    referenceSpace =
      renderer.xr.getReferenceSpace();


    viewerSpace =
      await session.requestReferenceSpace(
        "viewer"
      );


    hitTestSource =
      await session.requestHitTestSource({
        space:
          viewerSpace
      });


    session.addEventListener(
      "select",
      placeExhibition
    );


    session.addEventListener(
      "end",
      endSession
    );


    start.style.display =
      "none";


    instruction.style.display =
      "block";


    lastTimestamp =
      null;


    renderer.setAnimationLoop(
      render
    );

  }

  catch(error) {

    console.error(
      error
    );


    showError(
      "Nie udało się uruchomić AR. " +
      "Sprawdź HTTPS i uprawnienia."
    );

  }

}


/* ========================================= */
/* POSTAW WYSTAWĘ                            */
/* ========================================= */

function placeExhibition() {

  if (!reticle.visible) {
    return;
  }


  if (exhibitionPlaced) {
    return;
  }


  const hitPosition =
    new THREE.Vector3();


  hitPosition.setFromMatrixPosition(
    reticle.matrix
  );


  exhibition.position.copy(
    hitPosition
  );


  const xrCamera =
    renderer.xr.getCamera(
      camera
    );


  const direction =
    new THREE.Vector3();


  xrCamera.getWorldDirection(
    direction
  );


  direction.y =
    0;


  if (
    direction.lengthSq() > 0
  ) {

    direction.normalize();


    const angle =
      Math.atan2(
        direction.x,
        direction.z
      );


    exhibition.rotation.y =
      angle +
      Math.PI;

  }


  exhibition.visible =
    true;


  exhibitionPlaced =
    true;


  reticle.visible =
    false;


  if (session) {

    session.removeEventListener(
      "select",
      placeExhibition
    );

  }


  instruction.innerHTML =
    "Wystawa ustawiona.<br>" +
    "Możesz chodzić wokół rzeźb.";

}


/* ========================================= */
/* RENDER                                    */
/* ========================================= */

function render(
  timestamp,
  frame
) {

  if (lastTimestamp === null) {

    lastTimestamp =
      timestamp;

  }


  let delta =
    (timestamp - lastTimestamp) /
    1000;


  lastTimestamp =
    timestamp;


  delta =
    Math.min(
      Math.max(delta, 0),
      0.1
    );


  for (
    let i = 0;
    i < mixers.length;
    i++
  ) {

    mixers[i].update(
      delta
    );

  }


  if (
    frame &&
    hitTestSource &&
    referenceSpace &&
    !exhibitionPlaced
  ) {

    const results =
      frame.getHitTestResults(
        hitTestSource
      );


    if (
      results.length > 0
    ) {

      const hit =
        results[0];


      const pose =
        hit.getPose(
          referenceSpace
        );


      if (pose) {

        reticle.visible =
          true;


        reticle.matrix.fromArray(
          pose.transform.matrix
        );


        instruction.innerHTML =
          "Podłoga wykryta.<br>" +
          "Dotknij ekranu, aby ustawić wystawę.";

      }

    }

    else {

      reticle.visible =
        false;


      instruction.innerHTML =
        "Szukam podłogi...<br>" +
        "Poruszaj telefonem powoli.";

    }

  }


  renderer.render(
    scene,
    camera
  );

}


/* ========================================= */
/* END SESSION                               */
/* ========================================= */

function endSession() {

  session =
    null;


  referenceSpace =
    null;


  viewerSpace =
    null;


  hitTestSource =
    null;


  exhibitionPlaced =
    false;


  exhibition.visible =
    false;


  reticle.visible =
    false;


  lastTimestamp =
    null;


  renderer.setAnimationLoop(
    null
  );


  instruction.style.display =
    "none";


  start.style.display =
    "flex";

}


/* ========================================= */
/* ERROR                                     */
/* ========================================= */

function showError(message) {

  start.style.display =
    "none";


  errorScreen.style.display =
    "flex";


  errorText.textContent =
    message;

}


/* ========================================= */
/* RESIZE                                    */
/* ========================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* ========================================= */
/* START BUTTON                              */
/* ========================================= */

startButton.addEventListener(
  "click",
  startAR
);

</script>

</body>
</html>
