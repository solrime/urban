<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

<body>


<!-- ======================================== -->
<!-- START                                    -->
<!-- ======================================== -->

<div id="start">

  <div id="start-inner">

    <h1>WebXR 6DoF Test</h1>

    <p>
      Ten test sprawdzi, czy telefon poprawnie
      śledzi fizyczne przemieszczanie się
      w przestrzeni.
      <br><br>
      Po uruchomieniu skieruj telefon na podłogę.
    </p>

    <button id="start-button">
      URUCHOM AR
    </button>

  </div>

</div>



<!-- ======================================== -->
<!-- DEBUG                                    -->
<!-- ======================================== -->

<div id="debug">

  <strong>TRACKING DEBUG</strong>

  <br>

  X:
  <span id="debug-x">0.000</span> m

  <br>

  Y:
  <span id="debug-y">0.000</span> m

  <br>

  Z:
  <span id="debug-z">0.000</span> m

  <br><br>

  PRZESUNIĘCIE:

  <strong>
    <span id="debug-distance">0.000</span> m
  </strong>

  <br>

  FRAME:
  <span id="debug-frame">0</span>

</div>



<!-- ======================================== -->
<!-- INSTRUKCJA                               -->
<!-- ======================================== -->

<div id="instruction">
  Szukam podłogi...
</div>



<!-- ======================================== -->
<!-- ERROR                                    -->
<!-- ======================================== -->

<div id="error">

  <div id="error-inner">

    <h2>AR niedostępne</h2>

    <p id="error-text"></p>

  </div>

</div>



<!-- ======================================== -->
<!-- THREE.JS                                 -->
<!-- ======================================== -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>



<script type="module">

import * as THREE from "three";


/* ========================================== */
/* HTML                                       */
/* ========================================== */

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("start-button");

const debug =
  document.getElementById("debug");

const instruction =
  document.getElementById("instruction");

const errorScreen =
  document.getElementById("error");

const errorText =
  document.getElementById("error-text");


const debugX =
  document.getElementById("debug-x");

const debugY =
  document.getElementById("debug-y");

const debugZ =
  document.getElementById("debug-z");

const debugDistance =
  document.getElementById("debug-distance");

const debugFrame =
  document.getElementById("debug-frame");



/* ========================================== */
/* THREE                                     */
/* ========================================== */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    50
  );


const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.xr.enabled = true;


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


document.body.appendChild(
  renderer.domElement
);



/* ========================================== */
/* ŚWIATŁO                                   */
/* ========================================== */

const ambientLight =
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    3
  );


scene.add(
  ambientLight
);



const light =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );


light.position.set(
  2,
  5,
  3
);


scene.add(
  light
);



/* ========================================== */
/* RETICLE                                   */
/* ========================================== */

/*
  Białe kółko pokazuje wykrytą
  powierzchnię.
*/

const reticleGeometry =
  new THREE.RingGeometry(
    0.08,
    0.11,
    40
  );


reticleGeometry.rotateX(
  -Math.PI / 2
);


const reticleMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xffffff
  });


const reticle =
  new THREE.Mesh(
    reticleGeometry,
    reticleMaterial
  );


reticle.matrixAutoUpdate = false;

reticle.visible = false;


scene.add(
  reticle
);



/* ========================================== */
/* KOSTKA                                    */
/* ========================================== */

/*
  Kostka ma 30 × 30 × 30 cm.
*/

const cubeGeometry =
  new THREE.BoxGeometry(
    0.3,
    0.3,
    0.3
  );


const cubeMaterial =
  new THREE.MeshStandardMaterial({

    color: 0xff2222,

    roughness: 0.45,

    metalness: 0.05

  });


const cube =
  new THREE.Mesh(
    cubeGeometry,
    cubeMaterial
  );


cube.visible = false;


scene.add(
  cube
);



/* ========================================== */
/* PODSTAWA POD KOSTKĄ                       */
/* ========================================== */

const baseGeometry =
  new THREE.RingGeometry(
    0.22,
    0.25,
    40
  );


baseGeometry.rotateX(
  -Math.PI / 2
);


const baseMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xff2222
  });


const base =
  new THREE.Mesh(
    baseGeometry,
    baseMaterial
  );


base.visible = false;


scene.add(
  base
);



/* ========================================== */
/* WEBXR                                     */
/* ========================================== */

let session = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let objectPlaced = false;



/* ========================================== */
/* TRACKING                                  */
/* ========================================== */

/*
  initialCameraPosition:

  pozycja telefonu w momencie,
  kiedy stawiamy kostkę.
*/

const initialCameraPosition =
  new THREE.Vector3();


const currentCameraPosition =
  new THREE.Vector3();


const relativePosition =
  new THREE.Vector3();


let initialPositionSaved =
  false;


let frameCounter =
  0;



/* ========================================== */
/* START AR                                  */
/* ========================================== */

async function startAR() {

  if (!navigator.xr) {

    showError(
      "Ta przeglądarka nie udostępnia WebXR."
    );

    return;
  }


  try {

    const supported =
      await navigator.xr.isSessionSupported(
        "immersive-ar"
      );


    if (!supported) {

      showError(
        "To urządzenie / przeglądarka nie obsługuje immersive-ar."
      );

      return;
    }


    session =
      await navigator.xr.requestSession(

        "immersive-ar",

        {

          requiredFeatures: [
            "hit-test"
          ],

          optionalFeatures: [
            "local-floor",
            "dom-overlay"
          ],

          domOverlay: {
            root: document.body
          }

        }

      );


    /*
      WAŻNE:

      Three.js ma używać LOCAL jako
      przestrzeni odniesienia.
    */

    renderer.xr.setReferenceSpaceType(
      "local"
    );


    await renderer.xr.setSession(
      session
    );


    /*
      Pobieramy dokładnie tę przestrzeń
      odniesienia, której będziemy używać
      do hit-testu i odczytu pozycji.
    */

    referenceSpace =
      renderer.xr.getReferenceSpace();


    /*
      Viewer space = przestrzeń kamery.
    */

    viewerSpace =
      await session.requestReferenceSpace(
        "viewer"
      );


    /*
      Hit test.
    */

    hitTestSource =
      await session.requestHitTestSource({

        space: viewerSpace

      });


    /*
      Tapnięcie ekranu.
    */

    session.addEventListener(
      "select",
      placeCube
    );


    session.addEventListener(
      "end",
      endSession
    );


    start.style.display =
      "none";


    debug.style.display =
      "block";


    instruction.style.display =
      "block";


    renderer.setAnimationLoop(
      render
    );

  }

  catch (err) {

    console.error(err);


    showError(
      "Nie udało się uruchomić AR. " +
      "Sprawdź HTTPS, uprawnienia kamery " +
      "i obsługę ARCore/WebXR."
    );

  }

}



/* ========================================== */
/* POSTAW KOSTKĘ                             */
/* ========================================== */

function placeCube() {

  if (!reticle.visible) {
    return;
  }


  if (objectPlaced) {
    return;
  }


  /*
    Pobieramy pozycję wykrytej podłogi.
  */

  const hitPosition =
    new THREE.Vector3();


  hitPosition.setFromMatrixPosition(
    reticle.matrix
  );


  /*
    Kostka ma 30 cm wysokości.

    Jej środek musi być 15 cm
    nad podłogą.
  */

  cube.position.set(

    hitPosition.x,

    hitPosition.y + 0.15,

    hitPosition.z

  );


  /*
    Ring leży dokładnie na podłodze.
  */

  base.position.copy(
    hitPosition
  );


  cube.visible = true;

  base.visible = true;


  objectPlaced = true;

  reticle.visible = false;


  /*
    Zapisujemy pozycję telefonu
    w momencie ustawienia kostki.
  */

  const xrCamera =
    renderer.xr.getCamera(camera);


  xrCamera.getWorldPosition(
    initialCameraPosition
  );


  initialPositionSaved = true;


  instruction.innerHTML =
    "Kostka ustawiona.<br>" +
    "Teraz przejdź 1 metr w bok albo do tyłu.";

}



/* ========================================== */
/* RENDER                                    */
/* ========================================== */

function render(timestamp, frame) {

  frameCounter++;


  /* ======================================== */
  /* HIT TEST                                 */
  /* ======================================== */

  if (
    frame &&
    hitTestSource &&
    referenceSpace &&
    !objectPlaced
  ) {

    const results =
      frame.getHitTestResults(
        hitTestSource
      );


    if (results.length > 0) {

      const hit =
        results[0];


      const pose =
        hit.getPose(
          referenceSpace
        );


      if (pose) {

        reticle.visible = true;


        reticle.matrix.fromArray(
          pose.transform.matrix
        );


        instruction.innerHTML =
          "Podłoga wykryta.<br>" +
          "Dotknij ekranu, żeby postawić kostkę.";

      }

    }

    else {

      reticle.visible = false;


      instruction.innerHTML =
        "Szukam podłogi...<br>" +
        "Poruszaj telefonem powoli.";

    }

  }



  /* ======================================== */
  /* POZYCJA KAMERY                          */
  /* ======================================== */

  if (
    frame &&
    referenceSpace
  ) {

    /*
      Najważniejszy fragment tego testu.

      Nie zgadujemy pozycji telefonu
      na podstawie zwykłej kamery Three.js.

      Bierzemy pose bezpośrednio
      z klatki WebXR.
    */

    const viewerPose =
      frame.getViewerPose(
        referenceSpace
      );


    if (
      viewerPose &&
      viewerPose.views.length > 0
    ) {

      /*
        W AR obydwa oczy / view mają
        prawie tę samą pozycję.

        Do debugowania wystarczy
        pierwszy view.
      */

      const transform =
        viewerPose.transform;


      currentCameraPosition.set(

        transform.position.x,
        transform.position.y,
        transform.position.z

      );


      /*
        Jeżeli kostka została już
        ustawiona, pokazujemy ruch
        względem miejsca startowego.
      */

      if (initialPositionSaved) {

        relativePosition
          .copy(currentCameraPosition)
          .sub(initialCameraPosition);


        const distance =
          relativePosition.length();


        debugX.textContent =
          relativePosition.x.toFixed(3);


        debugY.textContent =
          relativePosition.y.toFixed(3);


        debugZ.textContent =
          relativePosition.z.toFixed(3);


        debugDistance.textContent =
          distance.toFixed(3);

      }

      /*
        Przed ustawieniem kostki
        pokazujemy pozycję absolutną
        w local reference space.
      */

      else {

        debugX.textContent =
          currentCameraPosition.x.toFixed(3);


        debugY.textContent =
          currentCameraPosition.y.toFixed(3);


        debugZ.textContent =
          currentCameraPosition.z.toFixed(3);


        debugDistance.textContent =
          "0.000";

      }

    }

  }


  debugFrame.textContent =
    frameCounter;


  /* ======================================== */
  /* RENDER                                   */
  /* ======================================== */

  renderer.render(
    scene,
    camera
  );

}



/* ========================================== */
/* KONIEC                                    */
/* ========================================== */

function endSession() {

  session = null;

  referenceSpace = null;

  viewerSpace = null;

  hitTestSource = null;


  objectPlaced = false;

  initialPositionSaved = false;


  cube.visible = false;

  base.visible = false;

  reticle.visible = false;


  initialCameraPosition.set(
    0,
    0,
    0
  );


  currentCameraPosition.set(
    0,
    0,
    0
  );


  relativePosition.set(
    0,
    0,
    0
  );


  renderer.setAnimationLoop(
    null
  );


  debug.style.display =
    "none";


  instruction.style.display =
    "none";


  start.style.display =
    "flex";

}



/* ========================================== */
/* ERROR                                     */
/* ========================================== */

function showError(message) {

  start.style.display =
    "none";


  errorScreen.style.display =
    "flex";


  errorText.textContent =
    message;

}



/* ========================================== */
/* RESIZE                                    */
/* ========================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);



/* ========================================== */
/* BUTTON                                    */
/* ========================================== */

startButton.addEventListener(
  "click",
  startAR
);

</script>

</body>
</html>
```
