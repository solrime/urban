<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>WebAR Exhibition</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}


/* ========================================= */
/* START                                     */
/* ========================================= */

#start {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #111;
  color: white;

  text-align: center;
}

#start-inner {
  width: 100%;
  max-width: 420px;
}

#start h1 {
  margin: 0 0 15px;
  font-size: 32px;
}

#start p {
  margin: 0 0 25px;

  opacity: 0.75;

  font-size: 16px;
  line-height: 1.5;
}

#start-button {
  width: 100%;

  padding: 18px;

  border: 0;
  border-radius: 14px;

  background: white;
  color: black;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}


/* ========================================= */
/* INFO                                      */
/* ========================================= */

#instruction {
  position: fixed;

  top: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 50;

  display: none;

  width: calc(100% - 30px);
  max-width: 450px;

  padding: 14px 18px;

  border-radius: 14px;

  background: rgba(0,0,0,0.72);
  color: white;

  text-align: center;

  font-size: 14px;
  line-height: 1.4;

  pointer-events: none;
}


/* ========================================= */
/* DEBUG                                     */
/* ========================================= */

#debug {
  position: fixed;

  bottom: 20px;
  left: 20px;

  z-index: 50;

  display: none;

  padding: 10px 14px;

  border-radius: 10px;

  background: rgba(0,0,0,0.65);
  color: white;

  font-family: monospace;
  font-size: 12px;

  pointer-events: none;
}

#model-status {
  margin-top: 5px;
}


/* ========================================= */
/* ERROR                                     */
/* ========================================= */

#error {
  position: fixed;
  inset: 0;

  z-index: 200;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #111;
  color: white;

  text-align: center;
}

</style>
</head>


<body>


<!-- ======================================= -->
<!-- START                                   -->
<!-- ======================================= -->

<div id="start">

  <div id="start-inner">

    <h1>Wystawa AR</h1>

    <p>
      Skieruj telefon na podłogę.
      <br><br>

      Kiedy pojawi się białe kółko,
      dotknij ekranu.
      <br><br>

      Punkt można ustawić tylko raz.
    </p>

    <button id="start-button">
      URUCHOM AR
    </button>

  </div>

</div>


<!-- ======================================= -->
<!-- INFO                                    -->
<!-- ======================================= -->

<div id="instruction">
  Szukam podłogi...
</div>


<!-- ======================================= -->
<!-- DEBUG                                   -->
<!-- ======================================= -->

<div id="debug">

  RUCH:
  <span id="distance">0.00</span> m

  <div id="model-status">
    MODELE: 0 / 4
  </div>

</div>


<!-- ======================================= -->
<!-- ERROR                                   -->
<!-- ======================================= -->

<div id="error">

  <div>

    <h2>AR niedostępne</h2>

    <p id="error-text"></p>

  </div>

</div>



<!-- ======================================= -->
<!-- THREE.JS                                -->
<!-- ======================================= -->

<script type="importmap">
{
  "imports": {

    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

  }
}
</script>


<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";



/* ========================================= */
/* HTML                                      */
/* ========================================= */

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("start-button");

const instruction =
  document.getElementById("instruction");

const debug =
  document.getElementById("debug");

const distanceText =
  document.getElementById("distance");

const modelStatus =
  document.getElementById("model-status");

const errorScreen =
  document.getElementById("error");

const errorText =
  document.getElementById("error-text");



/* ========================================= */
/*                                           */
/* KONFIGURACJA RZEŹB                        */
/*                                           */
/* ========================================= */

/*

  POSITION:

  x = lewo / prawo
  y = góra / dół
  z = przód / tył

  Jednostki = metry.


  SCALE:

  1    = 100%
  0.5  = 50%
  0.1  = 10%
  2    = 200%


  ROTATION:

  Podajesz w stopniach.

*/


const models = [


  /* ======================================= */
  /* RZEŹBA 1                                */
  /* ======================================= */

  {

    url:
      "https://cdn.tinyglb.com/models/7f210788d6204cf09324b3655d9bead3.glb",


    position: {

      x: 5.5,

      y: 4.5,

      z: 0

    },


    scale: 7,


    rotation: {

      x: 0,

      y: 0.5,

      z: 0

    }

  },



  /* ======================================= */
  /* RZEŹBA 2                                */
  /* ======================================= */

  {

    url:
      "https://cdn.tinyglb.com/models/778255d1a4ea48e8b0d28b870625a541.glb",


    position: {

      x: -5,

      y: 1,

      z: 0

    },


    scale: 7,


    rotation: {

      x: 0,

      y: 0.5,

      z: 0

    }

  },



  /* ======================================= */
  /* RZEŹBA 3                                */
  /* ======================================= */

  {

    url:
      "https://cdn.tinyglb.com/models/dd641c696ee1402c8d7e4a0427b58d70.glb",


    position: {

      x: 0,

      y: 0,

      z: 0

    },


    scale: 7,


    rotation: {

      x: 0,

      y: 0,

      z: 0

    }

  },



  /* ======================================= */
  /* RZEŹBA 4                                */
  /* ======================================= */

  {

    url:
      "https://cdn.tinyglb.com/models/cc241f3348914cccb0ee27be60c3d30f.glb",


    position: {

      x: 0,

      y: -1,

      z: -0.2

    },


    scale: 3,


    rotation: {

      x: 90,

      y: 0,

      z: 0

    }

  }


];



/* ========================================= */
/* SCENA                                     */
/* ========================================= */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(

    70,

    window.innerWidth /
    window.innerHeight,

    0.01,

    100

  );



/* ========================================= */
/* RENDERER                                  */
/* ========================================= */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    alpha: true

  });


renderer.setPixelRatio(

  Math.min(

    window.devicePixelRatio,

    2

  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.xr.enabled =
  true;


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.2;


document.body.appendChild(

  renderer.domElement

);



/* ========================================= */
/* ŚWIATŁO                                   */
/* ========================================= */

const hemisphere =
  new THREE.HemisphereLight(

    0xffffff,

    0x444444,

    3

  );


scene.add(

  hemisphere

);



const sun =
  new THREE.DirectionalLight(

    0xffffff,

    3

  );


sun.position.set(

  2,

  5,

  3

);


scene.add(

  sun

);



/* ========================================= */
/* RETICLE                                   */
/* ========================================= */

const reticleGeometry =
  new THREE.RingGeometry(

    0.08,

    0.11,

    40

  );


reticleGeometry.rotateX(

  -Math.PI / 2

);


const reticleMaterial =
  new THREE.MeshBasicMaterial({

    color: 0xffffff

  });


const reticle =
  new THREE.Mesh(

    reticleGeometry,

    reticleMaterial

  );


reticle.matrixAutoUpdate =
  false;


reticle.visible =
  false;


scene.add(

  reticle

);



/* ========================================= */
/* WYSTAWA                                   */
/* ========================================= */

const exhibition =
  new THREE.Group();


exhibition.visible =
  false;


scene.add(

  exhibition

);



/* ========================================= */
/* GLTF LOADER                               */
/* ========================================= */

const loader =
  new GLTFLoader();


let loadedModels =
  0;



/* ========================================= */
/* SHADE FLAT                                */
/* ========================================= */

function applyFlatShading(model) {


  model.traverse(

    (child) => {


      if (!child.isMesh) {

        return;

      }


      child.castShadow =
        true;


      child.receiveShadow =
        true;



      const materials =
        Array.isArray(child.material)

          ? child.material

          : [child.material];



      materials.forEach(

        (mat) => {


          if (!mat) {

            return;

          }



          /* ================================= */
          /* SHADE FLAT                        */
          /* ================================= */

          mat.flatShading =
            true;


          mat.needsUpdate =
            true;


        }

      );


    }

  );


}



/* ========================================= */
/* WCZYTAJ JEDEN MODEL                       */
/* ========================================= */

async function loadModel(

  config,

  number

) {


  try {


    const gltf =
      await loader.loadAsync(

        config.url

      );


    const model =
      gltf.scene;



    /* ===================================== */
    /* SHADE FLAT                            */
    /* ===================================== */

    applyFlatShading(

      model

    );



    /* ===================================== */
    /* POZYCJA                               */
    /* ===================================== */

    model.position.set(

      config.position.x,

      config.position.y,

      config.position.z

    );



    /* ===================================== */
    /* SKALA                                 */
    /* ===================================== */

    model.scale.setScalar(

      config.scale

    );



    /* ===================================== */
    /* ROTACJA                               */
    /* ===================================== */

    model.rotation.set(


      THREE.MathUtils.degToRad(

        config.rotation.x

      ),


      THREE.MathUtils.degToRad(

        config.rotation.y

      ),


      THREE.MathUtils.degToRad(

        config.rotation.z

      )


    );



    /* ===================================== */
    /* DODAJ DO WYSTAWY                      */
    /* ===================================== */

    exhibition.add(

      model

    );



    loadedModels++;


    modelStatus.innerHTML =

      "MODELE: " +

      loadedModels +

      " / " +

      models.length;



    console.log(

      "Model " +

      number +

      " załadowany",

      model

    );


  }


  catch(error) {


    console.error(

      "Błąd modelu " +

      number,

      error

    );


    modelStatus.innerHTML =

      "BŁĄD MODELU " +

      number;


  }


}



/* ========================================= */
/* WCZYTAJ WSZYSTKIE MODELE                  */
/* ========================================= */

models.forEach(

  (config, index) => {


    loadModel(

      config,

      index + 1

    );


  }

);



/* ========================================= */
/* PUNKT ZERO                                */
/* ========================================= */

const originGeometry =
  new THREE.RingGeometry(

    0.15,

    0.18,

    40

  );


originGeometry.rotateX(

  -Math.PI / 2

);


const origin =
  new THREE.Mesh(

    originGeometry,

    new THREE.MeshBasicMaterial({

      color: 0xffffff

    })

  );


origin.position.y =
  0.005;


exhibition.add(

  origin

);



/* ========================================= */
/* WEBXR                                     */
/* ========================================= */

let session =
  null;


let referenceSpace =
  null;


let viewerSpace =
  null;


let hitTestSource =
  null;


let exhibitionPlaced =
  false;



/* ========================================= */
/* TRACKING DEBUG                            */
/* ========================================= */

const initialCameraPosition =
  new THREE.Vector3();


const currentCameraPosition =
  new THREE.Vector3();


let initialPositionSaved =
  false;



/* ========================================= */
/* START AR                                  */
/* ========================================= */

async function startAR() {


  if (!navigator.xr) {


    showError(

      "Ta przeglądarka nie obsługuje WebXR."

    );


    return;


  }



  try {


    const supported =
      await navigator.xr.isSessionSupported(

        "immersive-ar"

      );



    if (!supported) {


      showError(

        "To urządzenie nie obsługuje immersive-ar."

      );


      return;


    }



    session =
      await navigator.xr.requestSession(


        "immersive-ar",


        {


          requiredFeatures: [

            "hit-test"

          ],


          optionalFeatures: [

            "local-floor",

            "dom-overlay"

          ],


          domOverlay: {

            root:
              document.body

          }


        }


      );



    /* ===================================== */
    /* REFERENCE SPACE                       */
    /* ===================================== */

    renderer.xr.setReferenceSpaceType(

      "local"

    );


    await renderer.xr.setSession(

      session

    );


    referenceSpace =
      renderer.xr.getReferenceSpace();



    /* ===================================== */
    /* VIEWER SPACE                          */
    /* ===================================== */

    viewerSpace =
      await session.requestReferenceSpace(

        "viewer"

      );



    /* ===================================== */
    /* HIT TEST                              */
    /* ===================================== */

    hitTestSource =
      await session.requestHitTestSource({

        space:
          viewerSpace

      });



    /* ===================================== */
    /* EVENTS                                */
    /* ===================================== */

    session.addEventListener(

      "select",

      placeExhibition

    );


    session.addEventListener(

      "end",

      endSession

    );



    /* ===================================== */
    /* UI                                    */
    /* ===================================== */

    start.style.display =
      "none";


    instruction.style.display =
      "block";


    debug.style.display =
      "block";



    /* ===================================== */
    /* RENDER LOOP                           */
    /* ===================================== */

    renderer.setAnimationLoop(

      render

    );


  }


  catch(error) {


    console.error(

      error

    );


    showError(

      "Nie udało się uruchomić AR. " +
      "Sprawdź HTTPS i uprawnienia."

    );


  }


}



/* ========================================= */
/* POSTAW WYSTAWĘ                            */
/* ========================================= */

function placeExhibition() {


  if (!reticle.visible) {

    return;

  }


  if (exhibitionPlaced) {

    return;

  }



  /* ======================================= */
  /* POZYCJA                                 */
  /* ======================================= */

  const hitPosition =
    new THREE.Vector3();


  hitPosition.setFromMatrixPosition(

    reticle.matrix

  );


  exhibition.position.copy(

    hitPosition

  );



  /* ======================================= */
  /* OBRÓT WYSTAWY                           */
  /* ======================================= */

  const xrCamera =
    renderer.xr.getCamera(

      camera

    );


  const direction =
    new THREE.Vector3();


  xrCamera.getWorldDirection(

    direction

  );


  direction.y =
    0;



  if (

    direction.lengthSq() > 0

  ) {


    direction.normalize();


    const angle =
      Math.atan2(

        direction.x,

        direction.z

      );


    exhibition.rotation.y =

      angle +

      Math.PI;


  }



  /* ======================================= */
  /* POKAŻ WYSTAWĘ                           */
  /* ======================================= */

  exhibition.visible =
    true;


  exhibitionPlaced =
    true;


  reticle.visible =
    false;



  /* ======================================= */
  /* BLOKADA KOLEJNYCH KLIKNIĘĆ              */
  /* ======================================= */

  if (session) {


    session.removeEventListener(

      "select",

      placeExhibition

    );


  }



  /* ======================================= */
  /* ZAPIS POZYCJI TELEFONU                  */
  /* ======================================= */

  const frame =
    renderer.xr.getFrame();



  if (

    frame &&

    referenceSpace

  ) {


    const viewerPose =
      frame.getViewerPose(

        referenceSpace

      );



    if (viewerPose) {


      initialCameraPosition.set(


        viewerPose.transform.position.x,


        viewerPose.transform.position.y,


        viewerPose.transform.position.z


      );


      initialPositionSaved =
        true;


    }


  }



  instruction.innerHTML =

    "Wystawa ustawiona.<br>" +

    "Możesz chodzić wokół rzeźb.";


}



/* ========================================= */
/* RENDER                                    */
/* ========================================= */

function render(

  timestamp,

  frame

) {


  /* ======================================= */
  /* HIT TEST                                */
  /* ======================================= */

  if (

    frame &&

    hitTestSource &&

    referenceSpace &&

    !exhibitionPlaced

  ) {


    const results =
      frame.getHitTestResults(

        hitTestSource

      );



    if (

      results.length > 0

    ) {


      const hit =
        results[0];


      const pose =
        hit.getPose(

          referenceSpace

        );



      if (pose) {


        reticle.visible =
          true;


        reticle.matrix.fromArray(

          pose.transform.matrix

        );


        instruction.innerHTML =

          "Podłoga wykryta.<br>" +

          "Dotknij ekranu, aby ustawić wystawę.";


      }


    }


    else {


      reticle.visible =
        false;


      instruction.innerHTML =

        "Szukam podłogi...<br>" +

        "Poruszaj telefonem powoli.";


    }


  }



  /* ======================================= */
  /* DEBUG RUCHU                             */
  /* ======================================= */

  if (

    frame &&

    referenceSpace &&

    initialPositionSaved

  ) {


    const viewerPose =
      frame.getViewerPose(

        referenceSpace

      );



    if (viewerPose) {


      currentCameraPosition.set(


        viewerPose.transform.position.x,


        viewerPose.transform.position.y,


        viewerPose.transform.position.z


      );



      const distance =
        currentCameraPosition.distanceTo(

          initialCameraPosition

        );



      distanceText.textContent =
        distance.toFixed(2);


    }


  }



  /* ======================================= */
  /* RENDER                                  */
  /* ======================================= */

  renderer.render(

    scene,

    camera

  );


}



/* ========================================= */
/* END SESSION                               */
/* ========================================= */

function endSession() {


  session =
    null;


  referenceSpace =
    null;


  viewerSpace =
    null;


  hitTestSource =
    null;


  exhibitionPlaced =
    false;


  initialPositionSaved =
    false;


  exhibition.visible =
    false;


  reticle.visible =
    false;


  distanceText.textContent =
    "0.00";


  renderer.setAnimationLoop(

    null

  );


  instruction.style.display =
    "none";


  debug.style.display =
    "none";


  start.style.display =
    "flex";


}



/* ========================================= */
/* ERROR                                     */
/* ========================================= */

function showError(message) {


  start.style.display =
    "none";


  errorScreen.style.display =
    "flex";


  errorText.textContent =
    message;


}



/* ========================================= */
/* RESIZE                                    */
/* ========================================= */

window.addEventListener(

  "resize",

  () => {


    camera.aspect =

      window.innerWidth /

      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


  }

);



/* ========================================= */
/* START BUTTON                              */
/* ========================================= */

startButton.addEventListener(

  "click",

  startAR

);

</script>

</body>
</html>
