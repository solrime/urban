<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Hiro Exhibition</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- AR.JS -->
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 450px;

      padding: 14px 18px;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      border-radius: 14px;

      text-align: center;

      font-size: 15px;
      line-height: 1.4;
    }

    #placeButton {
      position: absolute;

      left: 50%;
      bottom: 35px;

      transform: translateX(-50%);

      display: none;

      padding: 16px 28px;

      border: none;
      border-radius: 14px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: bold;

      pointer-events: auto;
      cursor: pointer;
    }

    #resetButton {
      position: absolute;

      right: 20px;
      bottom: 35px;

      display: none;

      padding: 12px 18px;

      border: none;
      border-radius: 12px;

      background: rgba(0,0,0,0.75);
      color: white;

      font-size: 14px;

      pointer-events: auto;
      cursor: pointer;
    }

    #markerIndicator {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 28px;
      height: 28px;

      border: 3px solid white;
      border-radius: 50%;

      display: none;

      box-shadow:
        0 0 0 2px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

  <!-- ====================================== -->
  <!-- UI                                     -->
  <!-- ====================================== -->

  <div id="ui">

    <div id="status">
      Szukam markera HIRO...
      <br>
      Skieruj kamerę na wydrukowany marker.
    </div>

    <div id="markerIndicator"></div>

    <button id="placeButton">
      USTAW WYSTAWĘ
    </button>

    <button id="resetButton">
      RESET
    </button>

  </div>


  <!-- ====================================== -->
  <!-- SCENA AR                               -->
  <!-- ====================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
      colorManagement: true;
    "

    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      detectionMode: mono;
      trackingMethod: best;
    "
  >


    <!-- ==================================== -->
    <!-- ŚWIATŁO                              -->
    <!-- ==================================== -->

    <a-entity
      light="
        type: ambient;
        intensity: 1.4;
      "
    ></a-entity>


    <a-entity
      light="
        type: directional;
        intensity: 1.2;
      "
      position="2 4 2"
    ></a-entity>



    <!-- ==================================== -->
    <!-- MARKER HIRO                          -->
    <!-- ==================================== -->

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >


      <!-- ================================== -->
      <!-- WSKAŹNIK NA MARKERZE               -->
      <!-- ================================== -->

      <!--
        Marker leży w płaszczyźnie XZ.

        Jeśli HIRO jest na ścianie,
        jego lokalny układ współrzędnych
        obraca się razem z markerem.
      -->

      <a-ring
        id="markerRing"

        position="0 0.03 0"

        rotation="-90 0 0"

        radius-inner="0.35"
        radius-outer="0.42"

        material="
          color: white;
          shader: flat;
        "
      ></a-ring>


      <!-- ================================== -->
      <!-- PUNKT CENTRALNY                    -->
      <!-- ================================== -->

      <a-sphere
        radius="0.08"

        position="0 0.05 0"

        material="
          color: red;
          shader: flat;
        "
      ></a-sphere>


    </a-marker>



    <!-- ==================================== -->
    <!-- WYSTAWA                              -->
    <!-- ==================================== -->

    <!--
      UWAGA:

      Wystawa NIE jest dzieckiem markera.

      Po kliknięciu skopiujemy world position
      i world rotation markera.

      Dzięki temu możemy potem próbować
      zostawić ją w świecie niezależnie
      od samego elementu <a-marker>.
    -->

    <a-entity
      id="exhibition"
      visible="false"
    >


      <!-- ================================== -->
      <!-- ORIGIN                             -->
      <!-- ================================== -->

      <a-sphere

        radius="0.05"

        position="0 0 0"

        material="
          color: white;
          shader: flat;
        "

      ></a-sphere>



      <!-- ================================== -->
      <!-- CZERWONA RZEŹBA                    -->
      <!-- ================================== -->

      <a-box

        position="0 -0.4 -1"

        width="0.3"
        height="0.8"
        depth="0.3"

        color="#ff3333"

      ></a-box>



      <!-- ================================== -->
      <!-- NIEBIESKA KULA                     -->
      <!-- ================================== -->

      <a-sphere

        position="-0.7 -0.3 -1.5"

        radius="0.25"

        color="#3388ff"

      ></a-sphere>



      <!-- ================================== -->
      <!-- ZIELONY SŁUP                       -->
      <!-- ================================== -->

      <a-cylinder

        position="0.8 -0.5 -1.8"

        radius="0.18"
        height="1"

        color="#33dd77"

      ></a-cylinder>



      <!-- ================================== -->
      <!-- ŻÓŁTY TORUS                        -->
      <!-- ================================== -->

      <a-torus

        position="-0.6 0 -2.3"

        radius="0.35"
        radius-tubular="0.09"

        rotation="0 0 0"

        color="#ffcc22"

      ></a-torus>



      <!-- ================================== -->
      <!-- FIOLETOWY STOŻEK                   -->
      <!-- ================================== -->

      <a-cone

        position="0.7 -0.4 -2.6"

        radius-bottom="0.35"
        radius-top="0"
        height="0.8"

        color="#cc44ff"

      ></a-cone>



      <!-- ================================== -->
      <!-- TURKUSOWY BOX                      -->
      <!-- ================================== -->

      <a-box

        position="0 -0.3 -3.2"

        width="0.7"
        height="0.7"
        depth="0.7"

        rotation="0 45 0"

        color="#00dddd"

      ></a-box>


    </a-entity>



    <!-- ==================================== -->
    <!-- KAMERA                               -->
    <!-- ==================================== -->

    <a-entity camera></a-entity>


  </a-scene>



<script>

  /* ======================================== */
  /* ELEMENTY                                */
  /* ======================================== */

  const marker =
    document.querySelector("#hiroMarker");

  const exhibition =
    document.querySelector("#exhibition");

  const status =
    document.querySelector("#status");

  const placeButton =
    document.querySelector("#placeButton");

  const resetButton =
    document.querySelector("#resetButton");

  const markerIndicator =
    document.querySelector("#markerIndicator");



  /* ======================================== */
  /* STAN                                    */
  /* ======================================== */

  let markerVisible = false;

  let exhibitionPlaced = false;



  /* ======================================== */
  /* MARKER FOUND                            */
  /* ======================================== */

  marker.addEventListener(
    "markerFound",
    () => {

      markerVisible = true;


      markerIndicator.style.display =
        "block";


      if (!exhibitionPlaced) {

        status.innerHTML =
          "HIRO znaleziony ✓<br>" +
          "Kliknij „USTAW WYSTAWĘ”.";

        placeButton.style.display =
          "block";

      }

      else {

        status.innerHTML =
          "HIRO znaleziony ponownie.";

      }

    }
  );



  /* ======================================== */
  /* MARKER LOST                             */
  /* ======================================== */

  marker.addEventListener(
    "markerLost",
    () => {

      markerVisible = false;


      markerIndicator.style.display =
        "none";


      placeButton.style.display =
        "none";


      if (!exhibitionPlaced) {

        status.innerHTML =
          "Marker zniknął.<br>" +
          "Skieruj kamerę ponownie na HIRO.";

      }

      else {

        status.innerHTML =
          "Wystawa ustawiona.<br>" +
          "Marker nie jest teraz widoczny.";

      }

    }
  );



  /* ======================================== */
  /* USTAW WYSTAWĘ                           */
  /* ======================================== */

  placeButton.addEventListener(
    "click",
    () => {


      if (!markerVisible) {

        return;

      }


      if (exhibitionPlaced) {

        return;

      }



      /* ==================================== */
      /* THREE.JS OBJECTS                     */
      /* ==================================== */

      const markerObject =
        marker.object3D;


      const exhibitionObject =
        exhibition.object3D;



      /* ==================================== */
      /* WORLD POSITION                       */
      /* ==================================== */

      /*
        Pobieramy pozycję HIRO
        w przestrzeni sceny.
      */

      const worldPosition =
        new THREE.Vector3();


      markerObject.getWorldPosition(
        worldPosition
      );



      /* ==================================== */
      /* WORLD ROTATION                       */
      /* ==================================== */

      /*
        Pobieramy orientację HIRO.

        To jest bardzo ważne,
        bo marker jest na ŚCIANIE.
      */

      const worldQuaternion =
        new THREE.Quaternion();


      markerObject.getWorldQuaternion(
        worldQuaternion
      );



      /* ==================================== */
      /* WORLD SCALE                          */
      /* ==================================== */

      const worldScale =
        new THREE.Vector3();


      markerObject.getWorldScale(
        worldScale
      );



      /* ==================================== */
      /* KOPIUJEMY TRANSFORM                  */
      /* ==================================== */

      exhibitionObject.position.copy(
        worldPosition
      );


      exhibitionObject.quaternion.copy(
        worldQuaternion
      );


      /*
        NIE kopiujemy skali markera.

        Chcemy kontrolować skalę
        wystawy sami.
      */

      exhibitionObject.scale.set(
        1,
        1,
        1
      );


      exhibitionObject.visible =
        true;


      exhibitionPlaced =
        true;



      /* ==================================== */
      /* UI                                   */
      /* ==================================== */

      placeButton.style.display =
        "none";


      resetButton.style.display =
        "block";


      status.innerHTML =
        "Wystawa ustawiona ✓<br>" +
        "Możesz odejść od markera.";

    }
  );



  /* ======================================== */
  /* RESET                                   */
  /* ======================================== */

  resetButton.addEventListener(
    "click",
    () => {


      exhibitionPlaced =
        false;


      exhibition.object3D.visible =
        false;


      resetButton.style.display =
        "none";


      if (markerVisible) {

        status.innerHTML =
          "HIRO znaleziony ✓<br>" +
          "Kliknij „USTAW WYSTAWĘ”.";


        placeButton.style.display =
          "block";

      }

      else {

        status.innerHTML =
          "Szukam markera HIRO...<br>" +
          "Skieruj kamerę na wydrukowany marker.";

      }

    }
  );

</script>


</body>
</html>
```
